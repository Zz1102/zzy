<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编程打字练习</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --text-color: #333333;
            --correct-color: #1976d2;
            --error-color: #e53935;
            --cursor-bg: #e0e0e0;
            --primary-color: #1976d2;
            --border-color: #e5e7eb;
            --sidebar-bg: #f8fafc;
            
            --finger-skin-color: #fce2d3;
            --finger-nail-color: #ffffff;
            --finger-stroke-color: #fce2d3;
            --finger-expected-color: #61a8ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1380px;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e0e0e0;
            height: 100%;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            background-color: #fafafa;
            padding: 14px 18px;
            border-bottom: 1px solid #eaeaea;
            flex-shrink: 0;
        }

        .header-left,
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .header-left {
            flex: 1;
        }

        input[type="file"] {
            display: none;
        }

        .custom-btn {
            padding: 7px 14px;
            font-size: 14px;
            background-color: #f7fbfe;
            color: #46657d;
            border: 1px solid #c7d9e6;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
        }

        .custom-btn:hover:not(:disabled) {
            background-color: #edf6fc;
            border-color: #8fb7d3;
            color: #2d648d;
        }

        .custom-btn:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .pause-btn.is-paused {
            color: #8a5b16;
            background-color: #fff4dd;
            border-color: #e7c784;
        }

        .filter-btn.is-active {
            color: #2e7d32;
            background-color: #e8f5e9;
            border-color: #81c784;
        }

        .stat-badge {
            font-size: 14px;
            font-weight: bold;
            background-color: #e1f5fe;
            padding: 7px 12px;
            border-radius: 4px;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .stat-time { color: #ef6c00; }
        .stat-typed { color: #8e24aa; }
        .stat-speed { color: #0277bd; }
        .stat-error { color: #d32f2f; }
        .stat-accuracy { color: #2e7d32; }
        .stat-total { color: #6a1b9a; }
        .stat-divider { color: #81d4fa; font-weight: normal; }

        .workspace {
            flex: 1;
            min-height: 0;
            display: flex;
        }

        .sidebar {
            width: 270px;
            min-width: 220px;
            display: flex;
            flex-direction: column;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background-color: #ffffff;
        }

        .sidebar-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .sidebar-title {
            margin: 0;
            font-size: 15px;
            color: #1f2937;
        }

        .file-count {
            min-width: 26px;
            padding: 2px 7px;
            border-radius: 999px;
            background: #e1f5fe;
            color: #0277bd;
            font-size: 12px;
            text-align: center;
        }

        .folder-btn,
        .single-file-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            font-weight: 600;
        }

        .folder-btn {
            color: #285f8b;
            background-color: #e2f0fb;
            border-color: #a8c9df;
        }

        .folder-btn:hover:not(:disabled) {
            color: #1f547c !important;
            background-color: #d4e9f8;
            border-color: #83afd0 !important;
        }

        .single-file-btn {
            color: #285f8b;
            background-color: #e2f0fb;
            border-color: #a8c9df;
        }

        .single-file-btn:hover:not(:disabled) {
            color: #1f547c !important;
            background-color: #d4e9f8;
            border-color: #83afd0 !important;
        }

        .folder-status {
            min-height: 18px;
            margin-top: 8px;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.4;
        }

        .file-list {
            flex: 1;
            min-height: 0;
            margin: 0;
            padding: 8px;
            list-style: none;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 4px;
            padding: 9px 10px;
            color: #374151;
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
        }

        .file-item:hover {
            background-color: #eef6ff;
            border-color: #dbeafe;
        }

        .file-item.active {
            color: #0d47a1;
            background-color: #e3f2fd;
            border-color: #90caf9;
            font-weight: 600;
        }

        .file-icon {
            flex-shrink: 0;
            font-size: 14px;
        }

        .file-info {
            min-width: 0;
        }

        .file-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 13px;
        }

        .file-path {
            display: block;
            margin-top: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #9ca3af;
            font-size: 11px;
            font-weight: normal;
        }

        .empty-files {
            padding: 24px 12px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }

        .main-panel {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .typing-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #typing-container {
            height: 100%;
            width: 100%;
            background-color: #ffffff;
            padding: 24px 24px 24px 12px; 
            font-size: 20px;
            line-height: 1.6;
            white-space: pre-wrap;
            tab-size: 4;
            -moz-tab-size: 4;
            -o-tab-size: 4;
            overflow-y: auto;
            font-family: 'Consolas', 'Courier New', monospace;
            scrollbar-width: thin;
            scrollbar-color: #c1c1c1 transparent;
            transition: filter 0.2s, opacity 0.2s;
            counter-reset: line-counter; 
        }

        #typing-container.paused {
            filter: blur(1.2px);
            opacity: 0.45;
            user-select: none;
        }

        #typing-container::-webkit-scrollbar { width: 6px; }
        #typing-container::-webkit-scrollbar-track { background: transparent; }
        #typing-container::-webkit-scrollbar-thumb { background-color: #d1d1d1; border-radius: 4px; }
        #typing-container::-webkit-scrollbar-thumb:hover { background-color: #a8a8a8; }

        .pause-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 20;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.22);
            pointer-events: none;
        }

        .pause-overlay.visible {
            display: flex;
        }

        .pause-card {
            padding: 18px 30px;
            border: 1px solid #fed7aa;
            border-radius: 10px;
            background-color: rgba(255, 247, 237, 0.96);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
            color: #c2410c;
            font-size: 18px;
            font-weight: bold;
        }

        .line { 
            display: block; 
            position: relative;
            padding-left: calc(3ch + 16px); 
        }
        
        .line::before {
            counter-increment: line-counter;
            content: counter(line-counter);
            position: absolute;
            left: 0;
            top: 0;
            width: 3ch;
            text-align: right; 
            color: #285f8b; 
            font-size: 20px; 
            user-select: none;
            pointer-events: none;
            font-family: inherit;
        }

        .char {
            display: inline-block;
            border-bottom: 2px solid transparent;
            min-width: 11px;
        }

        .fog-hidden {
            opacity: 0;
            transition: opacity 0.2s;
        }

        .correct { color: var(--correct-color); }

        .incorrect {
            color: var(--error-color);
            background-color: rgba(229, 57, 53, 0.15);
        }

        .auto-skip { color: #9e9e9e; }

        .current {
            background-color: var(--cursor-bg);
            border-bottom: 2px solid #f57c00;
            animation: blink 1s step-end infinite;
        }

        #typing-container.paused .current {
            animation-play-state: paused;
        }

        @keyframes blink {
            50% { border-bottom-color: transparent; }
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 32px 48px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            min-width: 280px;
        }

        .modal-content h2 {
            margin-top: 0;
            color: #333;
            margin-bottom: 24px;
            font-size: 22px;
        }

        .modal-stats {
            margin-bottom: 24px;
            text-align: left;
            font-size: 16px;
            line-height: 1.5;
        }

        .modal-stats div {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #e0e0e0;
            padding: 12px 0;
        }

        .modal-stats div:last-child { border-bottom: none; }

        .modal-btn {
            background-color: #e2f0fb;
            color: #285f8b;
            border: 1px solid #a8c9df;
            padding: 10px 32px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .modal-btn:hover {
            background-color: #d4e9f8;
            color: #1f547c;
            border-color: #83afd0;
        }

        .comment-skip {
            color: #b5bcc7;
            background: none;
        }

        .file-source-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
        }

        .file-source-actions .custom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
            padding: 8px 6px;
            font-size: 12px;
        }

        .sidebar-actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px;
            margin-top: 8px;
        }

        .sidebar-actions .custom-btn {
            padding: 7px 4px;
            font-size: 12px;
        }

        .record-save-status {
            min-height: 20px;
            margin: -8px 0 18px;
            color: #64748b;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .records-modal-content {
            width: min(900px, calc(100vw - 40px));
            max-height: calc(100vh - 60px);
            padding: 26px 28px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .records-content {
            min-height: 120px;
            overflow: auto;
        }

        .record-table-wrap {
            overflow: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .record-table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
            font-size: 13px;
        }

        .record-table th,
        .record-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
            text-align: center;
        }

        .record-table th {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: #f8fafc;
            color: #334155;
        }

        .record-table tr:last-child td {
            border-bottom: none;
        }

        .record-table .record-time { color: #ef6c00; }
        .record-table .record-speed { color: #0277bd; }
        .record-table .record-accuracy { color: #2e7d32; }
        .record-table .record-error { color: #d32f2f; }
        .record-table .record-total { color: #6a1b9a; }

        .record-table th.record-time,
        .record-table th.record-speed,
        .record-table th.record-accuracy,
        .record-table th.record-error,
        .record-table th.record-total {
            font-weight: 700;
        }

        .record-empty {
            padding: 38px 20px;
            color: #94a3b8;
            text-align: center;
        }

        .records-close-row {
            margin-top: 18px;
            text-align: center;
        }

        @media (max-width: 980px) {
            body { padding: 10px; }
            .header { align-items: flex-start; flex-direction: column; }
            .header-left, .header-right { width: 100%; flex-wrap: wrap; }
            .stat-badge { white-space: normal; line-height: 1.9; }
            .sidebar { width: 220px; min-width: 190px; }
        }

        .keyboard-panel {
            flex-shrink: 0;
            padding: 10px 14px 12px;
            background-color: #f7fbfe;
            border-top: 1px solid #d8e7f1;
            overflow-x: auto;
            transition: opacity 0.2s;
        }

        .keyboard-panel.is-hidden {
            display: none;
        }

        .keyboard-panel-inner {
            min-width: 760px;
            max-width: 1040px;
            margin: 0 auto;
            position: relative;
        }

        .keyboard-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 8px;
            color: #41627b;
            font-size: 12px;
        }

        .keyboard-panel-title {
            color: #294f6c;
            font-size: 13px;
            font-weight: 700;
        }

        .keyboard-hint {
            min-width: 0;
            overflow: hidden;
            color: #58758b;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .finger-guide {
            display: grid;
            grid-template-columns: repeat(5, minmax(54px, 1fr)) 22px repeat(5, minmax(54px, 1fr));
            gap: 5px;
            margin-bottom: 8px;
        }

        .finger-divider {
            width: 1px;
            height: 100%;
            justify-self: center;
            background-color: #d4e3ed;
        }

        .finger-item {
            padding: 5px 4px;
            color: #60798d;
            background-color: #ffffff;
            border: 1px solid #d3e1eb;
            border-radius: 6px;
            font-size: 11px;
            text-align: center;
            transition: all 0.12s;
            user-select: none;
        }

        .finger-item.expected {
            color: #1f5d89;
            background-color: #dcefff;
            border-color: #75afd5;
            box-shadow: 0 0 0 2px rgba(90, 157, 202, 0.14);
            font-weight: 700;
        }

        .finger-item.pressed {
            color: #1f5d89;
            background-color: #dcefff;
            border-color: #75afd5;
            transform: translateY(-1px);
        }

        .keyboard-layout {
            display: flex;
            flex-direction: column;
            gap: 5px;
            user-select: none;
            position: relative;
            z-index: 1; 
        }

        .keyboard-row {
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .keycap {
            position: relative;
            display: flex;
            flex: 1 1 0;
            align-items: center;
            justify-content: center;
            min-width: 39px;
            height: 34px;
            padding: 2px 5px;
            color: #405d73;
            background: linear-gradient(180deg, #ffffff 0%, #edf5fa 100%);
            border: 1px solid #c8d9e5;
            border-bottom-width: 2px;
            border-radius: 6px;
            box-shadow: 0 1px 2px rgba(51, 84, 108, 0.07);
            font-family: "Consolas", "Courier New", monospace;
            font-size: 12px;
            line-height: 1;
            transition: all 0.1s;
        }

        .keycap .key-main {
            font-weight: 700;
        }

        .keycap .key-shift {
            position: absolute;
            top: 3px;
            right: 5px;
            color: #8196a6;
            font-size: 9px;
        }

        .keycap.key-wide { flex-grow: 1.55; }
        .keycap.key-wider { flex-grow: 1.9; }
        .keycap.key-space { flex-grow: 6.2; }

        .keycap.expected {
            z-index: 2;
            color: #184f78;
            background: linear-gradient(180deg, #e6f4ff 0%, #d4eaff 100%);
            border-color: #5f9fca;
            box-shadow: 0 0 0 2px rgba(70, 142, 191, 0.16);
            transform: translateY(-1px);
        }

        .keycap.expected .key-shift {
            color: #2e6f9d;
        }

        .keycap.pressed {
            z-index: 3;
            color: #184f78;
            background: linear-gradient(180deg, #e6f4ff 0%, #d4eaff 100%);
            border-color: #5f9fca;
            box-shadow: 0 0 0 2px rgba(70, 142, 191, 0.16);
            transform: translateY(1px);
        }

        .hand-model-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: -55px; 
            pointer-events: none;
            position: relative;
            z-index: 5; 
            height: 160px; 
        }

        #hand-model-svg {
            height: 100%;
            width: auto;
            max-width: 100%;
            display: block;
        }
        
        #hand-model-svg .highlight-zone { 
            fill: transparent; 
            transition: fill 0.15s ease; 
        }
        
        #hand-model-svg .highlight-zone.expected { 
            fill: var(--finger-expected-color); 
        }

        @media (max-height: 780px) {
            .keyboard-panel { padding-top: 7px; padding-bottom: 8px; }
            .finger-item { padding: 3px 4px; }
            .keycap { height: 29px; }
            .hand-model-container { height: 130px; margin-top: -45px; }
        }


        /* ===== 2026 UI Redesign Overrides ===== */
        :root {
            --bg-color: #eef3f8;
            --text-color: #273444;
            --primary-color: #2f6f9f;
            --border-color: #dfe8f0;
            --sidebar-bg: #f7fafc;
            --surface: #ffffff;
            --surface-soft: #f7fafc;
            --surface-blue: #f2f8fc;
            --shadow-soft: 0 10px 35px rgba(34, 63, 89, 0.10);
            --shadow-card: 0 3px 14px rgba(34, 63, 89, 0.07);
            --radius-lg: 18px;
            --radius-md: 12px;
            --finger-skin-color: #fce2d3;
        }

        body {
            padding: 16px;
            background:
                radial-gradient(circle at 8% 0%, rgba(87, 151, 197, 0.10), transparent 28%),
                radial-gradient(circle at 100% 100%, rgba(120, 178, 219, 0.08), transparent 24%),
                var(--bg-color);
        }

        .app-container {
            max-width: 1520px;
            border: 1px solid rgba(191, 208, 221, 0.75);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-soft);
            background: rgba(255,255,255,0.98);
        }

        .header {
            min-height: 62px;
            padding: 10px 14px 10px 18px;
            gap: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
            border-bottom: 1px solid #e7edf3;
        }

        .current-file-name {
            position: relative;
            padding-left: 13px;
            font-size: 14px;
            color: #274056;
        }

        .header-right {
            justify-content: flex-end;
            gap: 7px;
        }

        .custom-btn {
            min-height: 34px;
            padding: 7px 12px;
            border-radius: 9px;
            border-color: #cadbe7;
            background: #f7fbfe;
            color: #3f6179;
            font-weight: 600;
            box-shadow: 0 1px 1px rgba(37, 73, 101, 0.03);
        }

        .custom-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(55, 97, 127, 0.08);
        }

        .stat-badge {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            min-height: 34px;
            padding: 6px 10px;
            border: 1px solid #d8eaf5;
            border-radius: 9px;
            background: #f3faff;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
            font-size: 12px;
        }

        .stat-divider { color: #bad6e8; }

        .workspace {
            gap: 0;
            background: #fff;
        }

        .sidebar {
            width: 240px;
            min-width: 210px;
            background: linear-gradient(180deg, #f8fbfd 0%, #f4f8fb 100%);
            border-right: 1px solid #e3ebf1;
        }

        .sidebar-header {
            padding: 14px;
            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(6px);
        }

        .sidebar-title-row { margin-bottom: 10px; }
        .sidebar-title { font-size: 14px; letter-spacing: .2px; }

        .file-count {
            min-width: 28px;
            padding: 3px 8px;
            background: #e8f4fb;
            color: #2b6c98;
            border: 1px solid #d2e8f6;
        }

        .file-list { padding: 9px 8px 14px; }

        .file-item {
            margin-bottom: 5px;
            padding: 9px 10px;
            border-radius: 9px;
        }

        .file-item:hover {
            background: #eef7fd;
            border-color: #d8eaf6;
        }

        .file-item.active {

        .line::before {
            color: #6f8da3;
            font-size: 16px;
            font-weight: 600;
            opacity: .9;
        }

        .char { min-width: 10px; border-radius: 3px; }

            background-color: #e8eff4;
            border-bottom-color: #ef8d32;

        .keyboard-panel {
            margin: 0 10px 10px;
            padding: 9px 8px 10px;
            border: 1px solid #dceaf3;
            border-top: 1px solid #d7e7f1;
            border-radius: 0 0 14px 14px;
            background: linear-gradient(180deg, #f5fafe 0%, #edf6fb 100%);
            box-shadow: 0 8px 18px rgba(45, 92, 126, 0.06);
            overflow-x: auto;
        }

        .keyboard-panel-inner {
            width: calc(100% - 4px);
            min-width: 820px;
            max-width: 1260px;
            margin: 0 auto;
            padding: 0 2px;
        }

        .keyboard-panel-header {
            margin: 0 3px 7px;
            padding: 0 2px;
        }

        .keyboard-panel-title {
            font-size: 13px;
            color: #2c5877;
        }

        .keyboard-hint {
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255,255,255,.65);
            border: 1px solid #dce9f2;
        }

        .finger-guide {
            grid-template-columns: repeat(5, minmax(58px, 1fr)) 16px repeat(5, minmax(58px, 1fr));
            gap: 4px;
            margin: 0 2px 7px;
        }

        .finger-item {
            padding: 5px 4px;
            border-radius: 7px;
            background: rgba(255,255,255,.88);
        }

        .keyboard-layout {
            gap: 5px;
            padding: 0 2px;
        }

        .keyboard-row {
            gap: 5px;
            width: 100%;
        }

        .keycap {
            min-width: 41px;
            height: 38px;
            border-radius: 7px;
            font-size: 12px;
            border-color: #bfd3e0;

        /* 全屏无缝布局：页面内容直接贴合浏览器四边 */
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0 !important;
            overflow: hidden;
            background: #ffffff;
        }

        body {
            display: block;
        }

        .app-container {
            width: 100vw;
            max-width: none;
            height: 100vh;
            margin: 0;
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        /* 主练习区与键盘区也取消外围留白，最大化可用空间 */
        .typing-wrapper {
            margin: 0;
            border-left: 0;
            border-right: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .keyboard-panel {
            margin: 0;
            border-left: 0;
            border-right: 0;
            border-bottom: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .keyboard-panel-inner {
            width: 100%;
            max-width: none;
            padding-left: 4px;
            padding-right: 4px;
        }

        /* 光标和错误字符统一使用直角矩形，不保留圆角 */
        .char,
        .current,
        .incorrect {
            border-radius: 0;
        }

        /* 顶部工具栏：移除文件标题后，统计与练习控制在左，页面级操作固定在最右侧 */
        .header {
            justify-content: flex-start;
        }

        .header-right {
            width: 100%;
            flex: 1 1 auto;
            justify-content: flex-start;
            flex-wrap: nowrap;
        }

        .stat-badge {
            flex: 0 0 auto;
        }

        .header-action-divider {
            width: 1px;

        .page-nav-actions {

            }

            .page-nav-actions {
                margin-left: 0;

</head>

<script>
    const RECORD_FILE_NAME = '酷爱打字通记录.json';
    const LOCAL_RECORD_KEY = 'cool-typing-practice-records-v1';
