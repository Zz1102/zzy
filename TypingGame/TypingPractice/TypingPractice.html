    const container = document.getElementById('typing-container');
    const combinedStatsDisplay = document.getElementById('combined-stats-display');
    const resetBtn = document.getElementById('reset-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseOverlay = document.getElementById('pause-overlay');
    const fileList = document.getElementById('file-list');
    const fileCount = document.getElementById('file-count');
    const folderStatus = document.getElementById('folder-status');
    const completionModal = document.getElementById('completion-modal');
    const completionRecordStatus = document.getElementById('completion-record-status');
    const recordsModal = document.getElementById('records-modal');
    const recordsModalTitle = document.getElementById('records-modal-title');
    const recordsContent = document.getElementById('records-content');
    const closingBracketFilterBtn = document.getElementById('closing-bracket-filter-btn');
    const fogModeBtn = document.getElementById('fog-mode-btn');
    const keyboardToggleBtn = document.getElementById('keyboard-toggle-btn');
    const keyboardPanel = document.getElementById('keyboard-panel');
    const keyboardLayout = document.getElementById('keyboard-layout');
    const fingerGuide = document.getElementById('finger-guide');
    const keyboardHint = document.getElementById('keyboard-hint');

    const FINGER_LABELS = {
        lp: '左小指',
        lr: '左无名指',
        lm: '左中指',
        li: '左食指',
        lt: '左拇指',
        rt: '右拇指',
        ri: '右食指',
        rm: '右中指',
        rr: '右无名指',
        rp: '右小指'
    };

    const FINGER_ORDER = ['lp', 'lr', 'lm', 'li', 'lt', 'divider', 'rt', 'ri', 'rm', 'rr', 'rp'];

    const KEYBOARD_ROWS = [
        [
            ['Backquote', '`', '~'], ['Digit1', '1', '!'], ['Digit2', '2', '@'],
            ['Digit3', '3', '#'], ['Digit4', '4', '$'], ['Digit5', '5', '%'],
            ['Digit6', '6', '^'], ['Digit7', '7', '&'], ['Digit8', '8', '*'],
            ['Digit9', '9', '('], ['Digit0', '0', ')'], ['Minus', '-', '_'],
            ['Equal', '=', '+'], ['Backspace', 'Backspace', '', 'key-wider']
        ],
        [
            ['Tab', 'Tab', '', 'key-wide'], ['KeyQ', 'Q'], ['KeyW', 'W'], ['KeyE', 'E'],
            ['KeyR', 'R'], ['KeyT', 'T'], ['KeyY', 'Y'], ['KeyU', 'U'], ['KeyI', 'I'],
            ['KeyO', 'O'], ['KeyP', 'P'], ['BracketLeft', '[', '{'],
            ['BracketRight', ']', '}'], ['Backslash', '\\', '|', 'key-wide']
        ],
        [
            ['CapsLock', 'Caps', '', 'key-wider'], ['KeyA', 'A'], ['KeyS', 'S'], ['KeyD', 'D'],
            ['KeyF', 'F'], ['KeyG', 'G'], ['KeyH', 'H'], ['KeyJ', 'J'], ['KeyK', 'K'],
            ['KeyL', 'L'], ['Semicolon', ';', ':'], ['Quote', "'", '"'],
            ['Enter', 'Enter', '', 'key-wider']
        ],
        [
            ['ShiftLeft', 'Shift', '', 'key-wider'], ['KeyZ', 'Z'], ['KeyX', 'X'], ['KeyC', 'C'],
            ['KeyV', 'V'], ['KeyB', 'B'], ['KeyN', 'N'], ['KeyM', 'M'],
            ['Comma', ',', '<'], ['Period', '.', '>'], ['Slash', '/', '?'],
            ['ShiftRight', 'Shift', '', 'key-wider']
        ],
        [
            ['ControlLeft', 'Ctrl', '', 'key-wide'], ['AltLeft', 'Alt', '', 'key-wide'],
            ['Space', 'Space', '', 'key-space'], ['AltRight', 'Alt', '', 'key-wide'],
            ['ControlRight', 'Ctrl', '', 'key-wide']
        ]
    ];

    const FINGER_BY_CODE = {
        Backquote: ['lp'], Digit1: ['lp'], KeyQ: ['lp'], KeyA: ['lp'], KeyZ: ['lp'],
        Tab: ['lp'], CapsLock: ['lp'], ShiftLeft: ['lp'], ControlLeft: ['lp'],
        Digit2: ['lr'], KeyW: ['lr'], KeyS: ['lr'], KeyX: ['lr'],
        Digit3: ['lm'], KeyE: ['lm'], KeyD: ['lm'], KeyC: ['lm'],
        Digit4: ['li'], Digit5: ['li'], KeyR: ['li'], KeyT: ['li'],
        KeyF: ['li'], KeyG: ['li'], KeyV: ['li'], KeyB: ['li'],
        Space: ['lt', 'rt'],
        Digit6: ['ri'], Digit7: ['ri'], KeyY: ['ri'], KeyU: ['ri'],
        KeyH: ['ri'], KeyJ: ['ri'], KeyN: ['ri'], KeyM: ['ri'],
        Digit8: ['rm'], KeyI: ['rm'], KeyK: ['rm'], Comma: ['rm'],
        Digit9: ['rr'], KeyO: ['rr'], KeyL: ['rr'], Period: ['rr'],
        Digit0: ['rp'], Minus: ['rp'], Equal: ['rp'], KeyP: ['rp'],
        BracketLeft: ['rp'], BracketRight: ['rp'], Backslash: ['rp'],
        Semicolon: ['rp'], Quote: ['rp'], Slash: ['rp'], Enter: ['rp'],
        Backspace: ['rp'], ShiftRight: ['rp'], ControlRight: ['rp'],
        AltLeft: ['lt'], AltRight: ['rt']
    };

    const CHAR_TO_CODE = {
        '`': 'Backquote', '~': 'Backquote',
        '1': 'Digit1', '!': 'Digit1', '2': 'Digit2', '@': 'Digit2',
        '3': 'Digit3', '#': 'Digit3', '4': 'Digit4', '$': 'Digit4',
        '5': 'Digit5', '%': 'Digit5', '6': 'Digit6', '^': 'Digit6',
        '7': 'Digit7', '&': 'Digit7', '8': 'Digit8', '*': 'Digit8',
        '9': 'Digit9', '(': 'Digit9', '0': 'Digit0', ')': 'Digit0',
        '-': 'Minus', '_': 'Minus', '=': 'Equal', '+': 'Equal',
        '[': 'BracketLeft', '{': 'BracketLeft', ']': 'BracketRight', '}': 'BracketRight',
        '\\': 'Backslash', '|': 'Backslash', ';': 'Semicolon', ':': 'Semicolon',
        "'": 'Quote', '"': 'Quote', ',': 'Comma', '<': 'Comma',
        '.': 'Period', '>': 'Period', '/': 'Slash', '?': 'Slash',
        ' ': 'Space', '\n': 'Enter', '\t': 'Tab'
    };

    const SHIFT_CHARACTERS = new Set(
        '~!@#$%^&*()_+{}|:"<>?ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
    );

    let keyboardPressedTimer = null;

    function renderFingerGuide() {
        fingerGuide.innerHTML = '';
        for (const fingerId of FINGER_ORDER) {
            if (fingerId === 'divider') {
                const divider = document.createElement('span');
                divider.className = 'finger-divider';
                fingerGuide.appendChild(divider);
                continue;
            }

            const finger = document.createElement('span');
            finger.className = 'finger-item';
            finger.dataset.finger = fingerId;
            finger.textContent = FINGER_LABELS[fingerId];
            fingerGuide.appendChild(finger);
        }
    }

    function renderKeyboard() {
        keyboardLayout.innerHTML = '';
        for (const rowData of KEYBOARD_ROWS) {
            const row = document.createElement('div');
            row.className = 'keyboard-row';

            for (const [code, mainLabel, shiftLabel = '', sizeClass = ''] of rowData) {
                const key = document.createElement('span');
                key.className = `keycap${sizeClass ? ` ${sizeClass}` : ''}`;
                key.dataset.code = code;

                const main = document.createElement('span');
                main.className = 'key-main';
                main.textContent = mainLabel;
                key.appendChild(main);

                if (shiftLabel) {
                    const shifted = document.createElement('span');
                    shifted.className = 'key-shift';
                    shifted.textContent = shiftLabel;
                    key.appendChild(shifted);
                }

                row.appendChild(key);
            }

            keyboardLayout.appendChild(row);
        }
    }

    function getCharacterCode(char) {
        if (Object.prototype.hasOwnProperty.call(CHAR_TO_CODE, char)) {
            return CHAR_TO_CODE[char];
        }

        if (/^[a-zA-Z]$/.test(char)) {
            return `Key${char.toUpperCase()}`;
        }

        return '';
    }

    function getExpectedKeyInfo(char) {
        const code = getCharacterCode(char);
        if (!code) return null;

        const fingers = [...(FINGER_BY_CODE[code] || [])];
        const extraCodes = [];
        const needsShift = SHIFT_CHARACTERS.has(char);

        if (needsShift) {
            const mainFinger = fingers[0] || '';
            const shiftCode = mainFinger.startsWith('l') ? 'ShiftRight' : 'ShiftLeft';
            extraCodes.push(shiftCode);
            for (const finger of FINGER_BY_CODE[shiftCode] || []) {
                if (!fingers.includes(finger)) fingers.push(finger);
            }
        }

        return { code, extraCodes, fingers, needsShift };
    }

    function clearKeyboardClass(className) {
        keyboardLayout.querySelectorAll(`.${className}`).forEach(element => {
            element.classList.remove(className);
        });
        fingerGuide.querySelectorAll(`.${className}`).forEach(element => {
            element.classList.remove(className);
        });
        
        if (className === 'expected') {
            document.querySelectorAll(`#hand-model-svg .highlight-zone.${className}`).forEach(element => {
                element.classList.remove(className);
            });
        }
    }

    function highlightKeyCode(code, className) {
        if (!code) return;
        const key = keyboardLayout.querySelector(`[data-code="${code}"]`);
        if (key) key.classList.add(className);
    }

    function highlightFingers(fingerIds, className) {
        for (const fingerId of fingerIds || []) {
            const finger = fingerGuide.querySelector(`[data-finger="${fingerId}"]`);
            if (finger) finger.classList.add(className);
            
            if (className === 'expected') {
                const svgFinger = document.getElementById(`svg-${fingerId}`);
                if (svgFinger) {
                    svgFinger.classList.add(className);
                }
            }
        }
    }

    function formatExpectedCharacter(char) {
        if (char === '\n') return 'Enter';
        if (char === '\t') return 'Tab';
        if (char === ' ') return '空格';
        return char;
    }

    function updateKeyboardGuide() {
        clearKeyboardClass('expected');

        if (currentTokenIndex >= tokens.length) {
            keyboardHint.textContent = tokens.length > 0 ? '本次练习已完成' : '当前没有可练习内容';
            return;
        }

        const token = tokens[currentTokenIndex];
        const info = getExpectedKeyInfo(token.char);
        if (!info) {
            keyboardHint.textContent = `目标字符：${formatExpectedCharacter(token.char)}`;
            return;
        }

        highlightKeyCode(info.code, 'expected');
        for (const code of info.extraCodes) highlightKeyCode(code, 'expected');
        highlightFingers(info.fingers, 'expected');

        const fingerText = info.fingers.map(id => FINGER_LABELS[id]).join(' + ');
        const keyText = info.needsShift
            ? `Shift + ${formatExpectedCharacter(token.char)}`
            : formatExpectedCharacter(token.char);
        keyboardHint.textContent = `目标键：${keyText}${fingerText ? ` 手指：${fingerText}` : ''}`;
    }

    function flashPressedKeyboard(code) {
        if (!code || keyboardPanel.classList.contains('is-hidden')) return;

        clearKeyboardClass('pressed');
        highlightKeyCode(code, 'pressed');
        highlightFingers(FINGER_BY_CODE[code] || [], 'pressed');

        if (keyboardPressedTimer) clearTimeout(keyboardPressedTimer);
        keyboardPressedTimer = setTimeout(() => {
            clearKeyboardClass('pressed');
            keyboardPressedTimer = null;
        }, 180);
    }

    keyboardToggleBtn.addEventListener('click', event => {
        event.target.blur();
        const isHidden = keyboardPanel.classList.toggle('is-hidden');
        keyboardToggleBtn.textContent = isHidden ? '显示键盘' : '隐藏键盘';
    });

    window.addEventListener('keydown', event => {
        flashPressedKeyboard(event.code);
    }, true);

    function isPageControl(element) {
        return element instanceof Element && Boolean(element.closest('button, label[for], input[type="file"]'));
    }

    document.addEventListener('focusin', event => {
        if (isPageControl(event.target) && typeof event.target.blur === 'function') {
            event.target.blur();
        }
    });

    document.addEventListener('mousedown', event => {
        if (isPageControl(event.target)) event.preventDefault();
    }, true);

    window.addEventListener('keydown', event => {
        if (!isPageControl(event.target)) return;
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            if (typeof event.target.blur === 'function') event.target.blur();
        }
    }, true);

    const defaultText = `#include<iostream>
using namespace std;
int main(){
    // 这是一条不需要输入的注释
    cout<<"I Love C++."<<endl; /* 块注释也会自动跳过 */
    return 0;
}`;

    let lines = [];
    let tokens = [];
    let currentTokenIndex = 0;
    let isPracticeActive = false;
    let isPaused = false;
    let completionHandled = false;
    let filterClosingBracketsEnabled = false;
    let isFogModeEnabled = false;

    const AUTO_FILL_CLOSING_BRACKETS = new Set([')', ']', '}']);

    let startTime = null;
    let timerInterval = null;
    let pauseStartedAt = null;
    let totalPausedMs = 0;
    let totalTypedChars = 0;
    let totalTypos = 0;

    let fileEntries = [];
    let activeFileId = null;
    let fileSequence = 0;
    let currentDirectoryHandle = null;
    let currentDirectoryName = '';
    let lastCompletedRecord = null;

    function createFileId() {
        fileSequence += 1;
        return `file-${Date.now()}-${fileSequence}`;
    }

    function getExtension(name) {
        const dotIndex = name.lastIndexOf('.');
        return dotIndex === -1 ? '' : name.slice(dotIndex).toLowerCase();
    }

    function isSupportedFile(name) {
        const ext = getExtension(name);
        return ext === '.cpp' || ext === '.txt';
    }

    function normalizeName(name) {
        return String(name || '').trim().toLocaleLowerCase('zh-CN');
    }

    function readFileAsText(file) {
        if (typeof file.text === 'function') return file.text();
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = event => resolve(event.target.result);
            reader.onerror = () => reject(reader.error || new Error(`无法读取文件：${file.name}`));
            reader.readAsText(file);
        });
    }

    function makeFileEntry({ name, path, text }) {
        return {
            id: createFileId(),
            name,
            path: path || name,
            text,
            isCpp: name.toLowerCase().endsWith('.cpp')
        };
    }

    function deduplicateFileCandidates(candidates) {
        const sorted = [...candidates].sort((a, b) => {
            const depthA = String(a.path || a.name).split('/').length;
            const depthB = String(b.path || b.name).split('/').length;
            if (depthA !== depthB) return depthA - depthB;
            return String(a.path || a.name).localeCompare(String(b.path || b.name), 'zh-CN', { numeric: true });
        });

        const seen = new Set();
        const unique = [];
        const duplicates = [];

        for (const candidate of sorted) {
            const key = normalizeName(candidate.name);
            if (seen.has(key)) {
                duplicates.push(candidate);
                continue;
            }
            seen.add(key);
            unique.push(candidate);
        }

        unique.sort((a, b) => String(a.path || a.name).localeCompare(String(b.path || b.name), 'zh-CN', { numeric: true }));
        return { unique, duplicates };
    }

    function renderFileList() {
        fileList.innerHTML = '';
        fileCount.textContent = String(fileEntries.length);

        if (fileEntries.length === 0) {
            const empty = document.createElement('li');
            empty.className = 'empty-files';
            empty.textContent = '暂无文件。请选择 HTML 所在文件夹，或读取单文件。';
            fileList.appendChild(empty);
            return;
        }

        fileEntries.forEach((entry, index) => {
            const item = document.createElement('li');
            const button = document.createElement('button');
            button.type = 'button';
            button.tabIndex = -1;
            button.className = `file-item${entry.id === activeFileId ? ' active' : ''}`;
            button.title = entry.path;
            button.dataset.fileId = entry.id;

            const info = document.createElement('span');
            info.className = 'file-info';

            const name = document.createElement('span');
            name.className = 'file-name';
            name.textContent = `${index + 1}. ${entry.name}`;
            info.appendChild(name);

            if (entry.path !== entry.name) {
                const path = document.createElement('span');
                path.className = 'file-path';
                path.textContent = entry.path;
                info.appendChild(path);
            }

            button.appendChild(info);
            button.addEventListener('click', () => selectFile(entry.id));
            item.appendChild(button);
            fileList.appendChild(item);
        });
    }

    function selectFile(fileId) {
        const entry = fileEntries.find(item => item.id === fileId);
        if (!entry) return;

        activeFileId = entry.id;
        completionModal.style.display = 'none';
        lastCompletedRecord = null;
        processText(entry.text, entry.isCpp);
        renderFileList();
    }

    function replaceFileEntries(entries) {
        fileEntries = entries;
        activeFileId = null;
        renderFileList();

        if (fileEntries.length > 0) {
            selectFile(fileEntries[0].id);
        }
    }

    function addOrReplaceSingleEntry(entry) {
        const existingIndex = fileEntries.findIndex(item => normalizeName(item.name) === normalizeName(entry.name));
        if (existingIndex >= 0) {
            entry.id = fileEntries[existingIndex].id;
            fileEntries.splice(existingIndex, 1, entry);
            folderStatus.textContent = `检测到同名文件，已替换：${entry.name}`;
        } else {
            fileEntries.push(entry);
            fileEntries.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));
        }
        selectFile(entry.id);
    }

    function parseText(text, isCpp) {
        const normalizedLineEndings = String(text || '').replace(/\r\n?/g, '\n');
        const normalized = normalizedLineEndings.replace(/[ \t\n]+$/g, '');
        const parsedTokens = [];
        let lineIndex = 0;
        let columnIndex = 0;
        let state = 'normal';
        let escaped = false;

        function pushToken(char, isComment) {
            if (lineIndex >= 999) return; 
            
            parsedTokens.push({
                char,
                line: lineIndex,
                column: columnIndex,
                isComment: Boolean(isComment),
                isAutoSkip: false,
                isClosingBracketAutoFill: false,
                isSyntheticNewline: false,
                typed: false,
                result: '',
                element: null,
                index: parsedTokens.length
            });
            if (char === '\n') {
                lineIndex += 1;
                columnIndex = 0;
            } else {
                columnIndex += 1;
            }
        }

        for (let i = 0; i < normalized.length; i++) {
            if (lineIndex >= 999) break; 
            
            const char = normalized[i];
            const next = normalized[i + 1] || '';

            if (!isCpp) {
                pushToken(char, false);
                continue;
            }

            if (state === 'line-comment') {
                pushToken(char, true);
                if (char === '\n') state = 'normal';
                continue;
            }

            if (state === 'block-comment') {
                pushToken(char, true);
                if (char === '*' && next === '/') {
                    i += 1;
                    pushToken('/', true);
                    state = 'normal';
                }
                continue;
            }

            if (state === 'string') {
                pushToken(char, false);
                if (escaped) {
                    escaped = false;
                } else if (char === '\\') {
                    escaped = true;
                } else if (char === '"') {
                    state = 'normal';
                }
                continue;
            }

            if (state === 'character') {
                pushToken(char, false);
                if (escaped) {
                    escaped = false;
                } else if (char === '\\') {
                    escaped = true;
                } else if (char === "'") {
                    state = 'normal';
                }
                continue;
            }

            if (char === '/' && next === '/') {
                pushToken('/', true);
                i += 1;
                pushToken('/', true);
                state = 'line-comment';
                continue;
            }

            if (char === '/' && next === '*') {
                pushToken('/', true);
                i += 1;
                pushToken('*', true);
                state = 'block-comment';
                continue;
            }

            if (char === '"') {
                pushToken(char, false);
                state = 'string';
                escaped = false;
                continue;
            }

            if (char === "'") {
                pushToken(char, false);
                state = 'character';
                escaped = false;
                continue;
            }

            pushToken(char, false);
        }

        const tokenLines = [];
        for (const token of parsedTokens) {
            if (!tokenLines[token.line]) tokenLines[token.line] = [];
            tokenLines[token.line].push(token);
        }

        for (const lineTokens of tokenLines) {
            if (!lineTokens) continue;

            let reachedContent = false;
            for (const token of lineTokens) {
                if (token.char === '\n') break;
                if (!reachedContent && (token.char === ' ' || token.char === '\t')) {
                    token.isAutoSkip = true;
                } else {
                    reachedContent = true;
                }
            }

            for (let i = 0; i < lineTokens.length; i++) {
                const token = lineTokens[i];
                const previous = i > 0 ? lineTokens[i - 1] : null;
                const isCommentStart = token.isComment && (!previous || !previous.isComment);
                if (!isCommentStart) continue;

                for (let j = i - 1; j >= 0; j--) {
                    const whitespace = lineTokens[j];
                    if (whitespace.char === ' ' || whitespace.char === '\t') {
                        whitespace.isAutoSkip = true;
                    } else {
                        break;
                    }
                }
            }

            const newlineToken = lineTokens.find(token => token.char === '\n' && !token.isSyntheticNewline);
            let lastMeaningfulIndex = -1;
            for (let i = lineTokens.length - 1; i >= 0; i--) {
                const token = lineTokens[i];
                if (token.char === '\n' || token.char === ' ' || token.char === '\t') continue;
                lastMeaningfulIndex = i;
                break;
            }

            if (lastMeaningfulIndex >= 0 && lineTokens[lastMeaningfulIndex].isComment) {
                if (newlineToken) {
                    for (let i = lastMeaningfulIndex + 1; i < lineTokens.length; i++) {
                        lineTokens[i].isComment = true;
                        lineTokens[i].isAutoSkip = false;
                    }
                    newlineToken.isComment = true;
                }

                let trailingCommentStart = lastMeaningfulIndex;
                while (trailingCommentStart > 0) {
                    const previous = lineTokens[trailingCommentStart - 1];
                    const isWhitespace = previous.char === ' ' || previous.char === '\t';
                    if (!previous.isComment && !isWhitespace) break;
                    trailingCommentStart -= 1;
                }

                const codeEndIndex = trailingCommentStart - 1;
                if (codeEndIndex >= 0) {
                    if (newlineToken) {
                        const newlineIndex = lineTokens.indexOf(newlineToken);
                        if (newlineIndex >= 0) lineTokens.splice(newlineIndex, 1);
                    }

                    const codeEndToken = lineTokens[codeEndIndex];
                    const syntheticNewline = {
                        char: '\n',
                        line: codeEndToken.line,
                        column: codeEndToken.column + 1,
                        isComment: false,
                        isAutoSkip: false,
                        isClosingBracketAutoFill: false,
                        isSyntheticNewline: true,
                        typed: false,
                        result: '',
                        element: null,
                        index: -1
                    };
                    lineTokens.splice(codeEndIndex + 1, 0, syntheticNewline);
                }
            }
        }

        parsedTokens.length = 0;
        for (const lineTokens of tokenLines) {
            if (!lineTokens) continue;
            for (const token of lineTokens) {
                token.index = parsedTokens.length;
                parsedTokens.push(token);
            }
        }

        return { parsedTokens, tokenLines };
    }

    function applyClosingBracketFilter() {
        for (const token of tokens) {
            token.isClosingBracketAutoFill = filterClosingBracketsEnabled
                && AUTO_FILL_CLOSING_BRACKETS.has(token.char)
                && !token.isComment;
        }

        closingBracketFilterBtn.classList.toggle('is-active', filterClosingBracketsEnabled);
        closingBracketFilterBtn.textContent = filterClosingBracketsEnabled
            ? '取消过滤'
            : '跳右括号';
        closingBracketFilterBtn.title = filterClosingBracketsEnabled
            ? '已自动填充 )、]、}；点击取消过滤并重新开始'
            : '自动填充 )、]、}，且不计入输入字符数';
    }

    function processText(text, isCpp) {
        const parsed = parseText(text, isCpp);
        tokens = parsed.parsedTokens;
        lines = parsed.tokenLines;
        applyClosingBracketFilter();
        initPractice();
    }

    function renderPractice() {
        container.innerHTML = '';
        if (tokens.length === 0) {
            container.innerHTML = '<div class="empty-files">当前文件没有可练习内容。</div>';
            return;
        }

        const maxLine = tokens.reduce((max, token) => Math.max(max, token.line), 0);
        for (let lineIndex = 0; lineIndex <= maxLine; lineIndex++) {
            const lineDiv = document.createElement('div');
            lineDiv.className = 'line';
            lineDiv.id = `line-${lineIndex}`;
            const lineTokens = lines[lineIndex] || [];

            for (const token of lineTokens) {
                const span = document.createElement('span');
                span.textContent = token.char === '\n' ? '↵' : token.char;
                span.className = 'char';
                span.id = `token-${token.index}`;
                if (token.isComment) span.classList.add('comment-skip');
                if (token.isClosingBracketAutoFill) span.classList.add('auto-skip');
                token.element = span;
                lineDiv.appendChild(span);
            }
            container.appendChild(lineDiv);
        }
    }

    function isSkippedToken(token) {
        return token && (token.isComment || token.isAutoSkip || token.isClosingBracketAutoFill);
    }

    function applySkippedStyle(token) {
        if (!token || !token.element) return;
        token.element.className = 'char';
        token.element.classList.add(token.isComment ? 'comment-skip' : 'auto-skip');
    }

    function advancePastSkippedTokens() {
        while (currentTokenIndex < tokens.length && isSkippedToken(tokens[currentTokenIndex])) {
            applySkippedStyle(tokens[currentTokenIndex]);
            currentTokenIndex += 1;
        }
    }

    function initPractice() {
        currentTokenIndex = 0;
        isPracticeActive = tokens.length > 0;
        completionHandled = false;
        lastCompletedRecord = null;

        for (const token of tokens) {
            token.typed = false;
            token.result = '';
        }

        resetTimer();
        renderPractice();
        updateCursor();
        updateStats();
        window.focus();
    }

    function setPaused(paused) {
        if (paused === isPaused) return;
        isPaused = paused;

        if (isPaused) {
            pauseStartedAt = startTime ? Date.now() : null;
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            pauseBtn.textContent = '继续练习';
            pauseBtn.classList.add('is-paused');
            container.classList.add('paused');
            pauseOverlay.classList.add('visible');
        } else {
            if (pauseStartedAt !== null) {
                totalPausedMs += Date.now() - pauseStartedAt;
                pauseStartedAt = null;
            }
            pauseBtn.textContent = '暂停练习';
            pauseBtn.classList.remove('is-paused');
            container.classList.remove('paused');
            pauseOverlay.classList.remove('visible');

            if (startTime && isPracticeActive) {
                timerInterval = setInterval(updateStats, 1000);
            }
        }
        updateStats();
    }

    function formatTime(ms) {
        if (!ms || ms < 0) return '00:00';
        const totalSeconds = Math.floor(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function getElapsedMs() {
        if (!startTime) return 0;
        const endTime = isPaused && pauseStartedAt !== null ? pauseStartedAt : Date.now();
        return Math.max(0, endTime - startTime - totalPausedMs);
    }

    function resetTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        startTime = null;
        pauseStartedAt = null;
        totalPausedMs = 0;
        totalTypedChars = 0;
        totalTypos = 0;
        isPaused = false;

        pauseBtn.textContent = '暂停练习';
        pauseBtn.classList.remove('is-paused');
        pauseBtn.disabled = tokens.length === 0;
        container.classList.remove('paused');
        pauseOverlay.classList.remove('visible');

        combinedStatsDisplay.innerHTML =
            `<span class="stat-time">时间: 00:00</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-speed">速度: 0 字符/分钟</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-error">输错率: 0.00%</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-typed">输入 0 字符</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-accuracy">正确率: 100.00%</span>`;
    }

    function getResultCounts() {
        let correctCount = 0;
        let incorrectCount = 0;
        let requiredChars = 0;
        for (const token of tokens) {
            if (!isSkippedToken(token) && token.char !== '\t') requiredChars += 1;
            if (token.result === 'correct') correctCount += 1;
            if (token.result === 'incorrect') incorrectCount += 1;
        }
        return { correctCount, incorrectCount, requiredChars };
    }

    function calculateResult() {
        const elapsedMs = getElapsedMs();
        const timeStr = formatTime(elapsedMs);
        const elapsedMinutes = elapsedMs / 60000;
        const cpm = elapsedMinutes > 0 ? Math.round(totalTypedChars / elapsedMinutes) : 0;
        const errorRate = totalTypedChars > 0
            ? ((totalTypos / totalTypedChars) * 100).toFixed(2)
            : '0.00';
        const counts = getResultCounts();
        const currentTotal = counts.correctCount + counts.incorrectCount;
        const accuracy = currentTotal > 0
            ? ((counts.correctCount / currentTotal) * 100).toFixed(2)
            : '100.00';

        return {
            elapsedMs,
            timeStr,
            cpm,
            errorRate,
            accuracy,
            totalArticleChars: totalTypedChars,
            totalTypedChars,
            totalTypos
        };
    }

    function updateStats() {
        const result = calculateResult();
        combinedStatsDisplay.innerHTML =
            `<span class="stat-time">时间: ${result.timeStr}</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-speed">速度: ${result.cpm} 字符/分钟</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-error">输错率: ${result.errorRate}%</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-typed">输入 ${result.totalTypedChars} 字符</span>` +
            `<span class="stat-divider">&nbsp;|&nbsp;</span>` +
            `<span class="stat-accuracy">正确率: ${result.accuracy}%</span>`;
    }

    function createCompletionRecord(result) {
        const entry = fileEntries.find(item => item.id === activeFileId);
        const completedAt = new Date();
        return {
            id: `${completedAt.getTime()}-${Math.random().toString(36).slice(2, 9)}`,
            fileName: entry ? entry.name : '未知文件',
            relativePath: entry ? entry.path : '未知文件',
            completedAt: completedAt.toISOString(),
            timeMs: result.elapsedMs,
            timeText: result.timeStr,
            speedCpm: result.cpm,
            errorRate: Number(result.errorRate),
            accuracy: Number(result.accuracy),
            requiredChars: result.totalArticleChars,
            typedChars: result.totalTypedChars,
            typos: result.totalTypos
        };
    }

    function showCompletionModal(result) {
        const modalStats = document.getElementById('modal-stats');
        modalStats.innerHTML = `
            <div><span class="stat-time"><strong>时间:</strong></span> <span>${result.timeStr}</span></div>
            <div><span class="stat-speed"><strong>速度:</strong></span> <span>${result.cpm} 字符/分钟</span></div>
            <div><span class="stat-error"><strong>输错率:</strong></span> <span>${result.errorRate}%</span></div>
            <div><span class="stat-accuracy"><strong>正确率:</strong></span> <span>${result.accuracy}%</span></div>
            <div><span class="stat-total"><strong>输入字符:</strong></span> <span>${result.totalTypedChars} 字符</span></div>
        `;
        completionRecordStatus.textContent = '正在保存完成记录……';
        completionModal.style.display = 'flex';
    }

    async function finishPractice() {
        if (completionHandled) return;
        completionHandled = true;
        isPracticeActive = false;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        pauseBtn.disabled = true;

        const result = calculateResult();
        lastCompletedRecord = createCompletionRecord(result);
        showCompletionModal(result);

        const saveResult = await saveRecord(lastCompletedRecord, false);
        completionRecordStatus.textContent = saveResult.message;
    }

    function updateFogMode() {
        if (!isFogModeEnabled) {
            for (const token of tokens) {
                if (token.element) token.element.classList.remove('fog-hidden');
            }
            return;
        }

        let typableCount = 0;
        for (let i = 0; i < tokens.length; i++) {
            const token = tokens[i];
            if (!token.element) continue;

            if (token.isComment) {
                token.element.classList.remove('fog-hidden');
            } else if (i < currentTokenIndex) {
                token.element.classList.remove('fog-hidden');
            } else {
                if (isSkippedToken(token)) {
                    if (typableCount < 2) {
                        token.element.classList.remove('fog-hidden');
                    } else {
                        token.element.classList.add('fog-hidden');
                    }
                } else {
                    if (typableCount < 2) {
                        token.element.classList.remove('fog-hidden');
                        typableCount++;
                    } else {
                        token.element.classList.add('fog-hidden');
                    }
                }
            }
        }
    }

    function updateCursor() {
        container.querySelectorAll('.current').forEach(element => element.classList.remove('current'));
        advancePastSkippedTokens();
        updateKeyboardGuide();

        if (currentTokenIndex >= tokens.length) {
            updateFogMode();
            void finishPractice();
            return;
        }

        const token = tokens[currentTokenIndex];
        if (token && token.element) {
            token.element.classList.add('current');
            token.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        updateFogMode();
    }

    function clearTokenResult(token) {
        if (!token) return;
        token.typed = false;
        token.result = '';
        if (token.element) token.element.className = 'char';
        if (token.isComment) token.element.classList.add('comment-skip');
        if (token.isAutoSkip || token.isClosingBracketAutoFill) token.element.classList.add('auto-skip');
    }

    function handleBackspace() {
        let index = currentTokenIndex - 1;
        while (index >= 0 && (!tokens[index].typed || isSkippedToken(tokens[index]))) index -= 1;
        if (index < 0) return;
        clearTokenResult(tokens[index]);
        currentTokenIndex = index;
        updateCursor();
        updateStats();
    }

    function skipCurrentLine() {
        while (currentTokenIndex < tokens.length) {
            const token = tokens[currentTokenIndex];
            token.isAutoSkip = true;
            applySkippedStyle(token);
            currentTokenIndex += 1;
            if (token.char === '\n') break;
        }
        updateCursor();
    }

    fileUpload.addEventListener('change', async event => {
        const file = event.target.files[0];
        if (!file) return;
        event.target.blur();

        if (!isSupportedFile(file.name)) {
            folderStatus.textContent = '仅支持 .cpp 和 .txt 文件。';
            event.target.value = '';
            return;
        }

        try {
            const text = await readFileAsText(file);
            addOrReplaceSingleEntry(makeFileEntry({ name: file.name, path: file.name, text }));
            if (!folderStatus.textContent.includes('同名文件')) {
                folderStatus.textContent = `已添加文件：${file.name}`;
            }
        } catch (error) {
            folderStatus.textContent = error.message || '读取文件失败。';
        } finally {
            event.target.value = '';
        }
    });

    closingBracketFilterBtn.addEventListener('click', event => {
        event.target.blur();
        filterClosingBracketsEnabled = !filterClosingBracketsEnabled;
        applyClosingBracketFilter();
        completionModal.style.display = 'none';
        lastCompletedRecord = null;
        if (tokens.length > 0) initPractice();
    });

    fogModeBtn.addEventListener('click', event => {
        event.target.blur();
        isFogModeEnabled = !isFogModeEnabled;
        fogModeBtn.classList.toggle('is-active', isFogModeEnabled);
        completionModal.style.display = 'none';
        lastCompletedRecord = null;
        if (tokens.length > 0) initPractice();
    });

    pauseBtn.addEventListener('click', event => {
        event.target.blur();
        if (!isPracticeActive || tokens.length === 0) return;
        setPaused(!isPaused);
    });

    resetBtn.addEventListener('click', event => {
        event.target.blur();
        if (tokens.length > 0) {
            completionModal.style.display = 'none';
            initPractice();
        }
    });

    window.addEventListener('keydown', event => {
        if (!isPracticeActive || isPaused) return;
        if (completionModal.style.display === 'flex' || recordsModal.style.display === 'flex') return;

        if (event.key === ' ') event.preventDefault();
        if (event.key === 'Tab') event.preventDefault();

        if (event.key.length > 1 && event.key !== 'Backspace' && event.key !== 'Enter' && event.key !== 'Tab') return;
        if (event.ctrlKey || event.altKey || event.metaKey) return;

        if (event.key === 'Backspace') {
            event.preventDefault();
            handleBackspace();
            return;
        }

        if (!startTime) {
            startTime = Date.now();
            timerInterval = setInterval(updateStats, 1000);
        }

        const token = tokens[currentTokenIndex];
        if (!token || isSkippedToken(token)) {
            updateCursor();
            return;
        }

        totalTypedChars += 1;
        const isCorrect = token.char === '\n'
            ? event.key === 'Enter'
            : token.char === '\t'
                ? event.key === 'Tab'
                : event.key === token.char;
        token.typed = true;
        token.result = isCorrect ? 'correct' : 'incorrect';
        token.element.className = `char ${token.result}`;
        if (!isCorrect) totalTypos += 1;
        currentTokenIndex += 1;

        updateCursor();
        updateStats();
    });

    function openHandleDatabase() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = () => {
                const db = request.result;
                if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
            };
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    async function saveDirectoryHandle(handle) {
        try {
            const db = await openHandleDatabase();
            await new Promise((resolve, reject) => {
                const transaction = db.transaction(DB_STORE, 'readwrite');
                transaction.objectStore(DB_STORE).put(handle, DIRECTORY_HANDLE_KEY);
                transaction.oncomplete = resolve;
                transaction.onerror = () => reject(transaction.error);
            });
            db.close();
        } catch (error) {
        }
    }

    async function getSavedDirectoryHandle() {
        try {
            const db = await openHandleDatabase();
            const result = await new Promise((resolve, reject) => {
                const transaction = db.transaction(DB_STORE, 'readonly');
                const request = transaction.objectStore(DB_STORE).get(DIRECTORY_HANDLE_KEY);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error);
            });
            db.close();
            return result;
        } catch (error) {
            return null;
        }
    }

    async function queryDirectoryPermission(handle, mode = 'readwrite') {
        if (!handle || typeof handle.queryPermission !== 'function') return false;
        try {
            return await handle.queryPermission({ mode }) === 'granted';
        } catch (error) {
            return false;
        }
    }

    async function requestDirectoryPermission(handle, mode = 'readwrite') {
        if (!handle) return false;
        if (await queryDirectoryPermission(handle, mode)) return true;
        if (typeof handle.requestPermission !== 'function') return false;
        try {
            return await handle.requestPermission({ mode }) === 'granted';
        } catch (error) {
            return false;
        }
    }

    async function collectDirectoryCandidates(directoryHandle, prefix = '') {
        const results = [];
        for await (const [name, handle] of directoryHandle.entries()) {
            const relativePath = prefix ? `${prefix}/${name}` : name;
            if (handle.kind === 'directory') {
                const nested = await collectDirectoryCandidates(handle, relativePath);
                results.push(...nested);
            } else if (handle.kind === 'file' && isSupportedFile(name)) {
                results.push({ name, path: relativePath, handle });
            }
        }
        return results;
    }

    async function loadDirectoryFromHandle(directoryHandle, isAutomatic = false) {
        folderStatus.textContent = isAutomatic ? '正在自动读取上次授权的工作文件夹……' : '正在读取工作文件夹……';
        const candidates = await collectDirectoryCandidates(directoryHandle);
        const { unique, duplicates } = deduplicateFileCandidates(candidates);

        if (unique.length === 0) {
            replaceFileEntries([]);
            folderStatus.textContent = '文件夹内没有找到 .cpp 或 .txt 文件。';
            return;
        }

        const entries = [];
        for (const candidate of unique) {
            const file = await candidate.handle.getFile();
            const text = await readFileAsText(file);
            entries.push(makeFileEntry({ name: candidate.name, path: candidate.path, text }));
        }

        replaceFileEntries(entries);
        currentDirectoryHandle = directoryHandle;
        currentDirectoryName = directoryHandle.name || '工作文件夹';
        refreshFolderBtn.disabled = false;
        const duplicateText = duplicates.length > 0 ? `；发现 ${duplicates.length} 个同名文件，已去重` : '';
        folderStatus.textContent = `${isAutomatic ? '自动读取完成' : '读取完成'}：${currentDirectoryName}，共 ${entries.length} 个文件${duplicateText}。`;
    }

    async function chooseWorkingDirectory() {
        if (typeof window.showDirectoryPicker !== 'function') {
            folderUpload.click();
            return;
        }

        try {
            const handle = await window.showDirectoryPicker({ mode: 'readwrite', id: 'cool-typing-work-directory' });
            const granted = await requestDirectoryPermission(handle, 'readwrite');
            if (!granted) {
                folderStatus.textContent = '未获得文件夹读写权限。';
                return;
            }
            currentDirectoryHandle = handle;
            currentDirectoryName = handle.name || '工作文件夹';
            await saveDirectoryHandle(handle);
            await loadDirectoryFromHandle(handle, false);
        } catch (error) {
            if (error && error.name !== 'AbortError') {
                folderStatus.textContent = `读取文件夹失败：${error.message || error}`;
            }
        }
    }

    folderPickerBtn.addEventListener('click', chooseWorkingDirectory);

    refreshFolderBtn.addEventListener('click', async () => {
        if (!currentDirectoryHandle) {
            await chooseWorkingDirectory();
            return;
        }
        const granted = await requestDirectoryPermission(currentDirectoryHandle, 'readwrite');
        if (!granted) {
            folderStatus.textContent = '需要重新授权工作文件夹。';
            return;
        }
        try {
            await loadDirectoryFromHandle(currentDirectoryHandle, false);
        } catch (error) {
            folderStatus.textContent = `刷新失败：${error.message || error}`;
        }
    });

    folderUpload.addEventListener('change', async event => {
        const selectedFiles = Array.from(event.target.files || []);
        const candidates = selectedFiles
            .filter(file => isSupportedFile(file.name))
            .map(file => ({
                name: file.name,
                path: file.webkitRelativePath || file.name,
                file
            }));
        const { unique, duplicates } = deduplicateFileCandidates(candidates);

        if (unique.length === 0) {
            folderStatus.textContent = '所选文件夹中没有找到 .cpp 或 .txt 文件。';
            event.target.value = '';
            return;
        }

        try {
            const entries = [];
            for (const candidate of unique) {
                const text = await readFileAsText(candidate.file);
                entries.push(makeFileEntry({ name: candidate.name, path: candidate.path, text }));
            }
            replaceFileEntries(entries);
            const duplicateText = duplicates.length > 0 ? `，已去除 ${duplicates.length} 个同名文件` : '';
            folderStatus.textContent = `读取完成，共 ${entries.length} 个文件${duplicateText}。当前浏览器仅授予读取权限，记录将先保存到浏览器。`;
        } catch (error) {
            folderStatus.textContent = error.message || '读取文件夹失败。';
        } finally {
            event.target.value = '';
        }
    });

    async function restoreAndAutoLoadDirectory() {
        if (typeof window.showDirectoryPicker !== 'function') {
            folderStatus.textContent = '当前浏览器不支持自动目录授权。可手动读取文件夹；建议使用最新版 Chrome 或 Edge。';
            return;
        }

        const handle = await getSavedDirectoryHandle();
        if (!handle) {
            folderStatus.textContent = '首次使用：请选择 HTML 所在文件夹。授权后，下次打开会自动读取其中的 .cpp 和 .txt。';
            return;
        }

        currentDirectoryHandle = handle;
        currentDirectoryName = handle.name || '工作文件夹';
        const granted = await queryDirectoryPermission(handle, 'readwrite');
        if (!granted) {
            folderStatus.textContent = `已记住文件夹“${currentDirectoryName}”，请点击“读取文件夹”重新授权。`;
            return;
        }

        try {
            await loadDirectoryFromHandle(handle, true);
        } catch (error) {
            folderStatus.textContent = `自动读取失败，请重新选择文件夹：${error.message || error}`;
        }
    }

    function getLocalRecords() {
        try {
            const parsed = JSON.parse(localStorage.getItem(LOCAL_RECORD_KEY) || '[]');
            return Array.isArray(parsed) ? parsed : [];
        } catch (error) {
            return [];
        }
    }

    function saveLocalRecord(record) {
        try {
            const records = getLocalRecords();
            const index = records.findIndex(item => item.id === record.id);
            if (index >= 0) records[index] = record;
            else records.push(record);
            localStorage.setItem(LOCAL_RECORD_KEY, JSON.stringify(records));
            return true;
        } catch (error) {
            return false;
        }
    }

    async function readRecordFile(directoryHandle) {
        if (!directoryHandle) return [];
        try {
            const fileHandle = await directoryHandle.getFileHandle(RECORD_FILE_NAME, { create: false });
            const file = await fileHandle.getFile();
            const text = await file.text();
            if (!text.trim()) return [];
            const parsed = JSON.parse(text);
            return Array.isArray(parsed) ? parsed : Array.isArray(parsed.records) ? parsed.records : [];
        } catch (error) {
            if (error && error.name === 'NotFoundError') return [];
            throw error;
        }
    }

    async function writeRecordFile(directoryHandle, records) {
        const fileHandle = await directoryHandle.getFileHandle(RECORD_FILE_NAME, { create: true });
        const writable = await fileHandle.createWritable();
        const payload = {
            version: 1,
            updatedAt: new Date().toISOString(),
            records
        };
        await writable.write(JSON.stringify(payload, null, 2));
        await writable.close();
    }

    function mergeRecords(...recordGroups) {
        const map = new Map();
        for (const group of recordGroups) {
            for (const record of group || []) {
                if (record && record.id) map.set(record.id, record);
            }
        }
        return Array.from(map.values()).sort((a, b) => String(b.completedAt).localeCompare(String(a.completedAt)));
    }

    async function saveRecord(record, allowPermissionPrompt) {
        if (!record) return { success: false, message: '没有可保存的完成记录。' };
        const localSaved = saveLocalRecord(record);

        if (!currentDirectoryHandle) {
            return localSaved
                ? {
                    success: true,
                    message: '记录已保存到浏览器。选择工作文件夹并授权后，可同步写入“酷爱打字通记录.json”。'
                }
                : {
                    success: false,
                    message: '当前页面无法使用浏览器存储。请先读取工作文件夹，完成练习后系统会自动保存记录。'
                };
        }

        const granted = allowPermissionPrompt
            ? await requestDirectoryPermission(currentDirectoryHandle, 'readwrite')
            : await queryDirectoryPermission(currentDirectoryHandle, 'readwrite');

        if (!granted) {
            return {
                success: true,
                message: '记录已保存到浏览器；重新读取文件夹并授予写入权限后，可继续同步到记录文件。'
            };
        }

        try {
            const fileRecords = await readRecordFile(currentDirectoryHandle);
            const localRecords = getLocalRecords();
            const merged = mergeRecords(fileRecords, localRecords, [record]);
            await writeRecordFile(currentDirectoryHandle, merged);
            return {
                success: true,
                message: `记录已保存到“${currentDirectoryName || '工作文件夹'}/${RECORD_FILE_NAME}”。`
            };
        } catch (error) {
            return {
                success: false,
                message: `写入记录文件失败，已保存在浏览器中：${error.message || error}`
            };
        }
    }

    function formatRecordDate(isoString) {
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return String(isoString || '');
        return date.toLocaleString('zh-CN', { hour12: false });
    }

    function renderRecords(records, fileName) {
        recordsModalTitle.textContent = `${fileName} 的历史记录`;
        recordsContent.innerHTML = '';

        if (records.length === 0) {
            recordsContent.innerHTML = '<div class="record-empty">没有找到同名文件的历史记录。</div>';
            return;
        }

        const tableWrap = document.createElement('div');
        tableWrap.className = 'record-table-wrap';
        const table = document.createElement('table');
        table.className = 'record-table';
        table.innerHTML = `
            <thead>
                <tr>
                    <th class="record-time">完成时间</th>
                    <th class="record-time">用时</th>
                    <th class="record-speed">速度</th>
                    <th class="record-accuracy">正确率</th>
                    <th class="record-error">输错率</th>
                    <th class="record-total">输入字符</th>
                </tr>
            </thead>
        `;
        const tbody = document.createElement('tbody');
        for (const record of records) {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="record-time">${formatRecordDate(record.completedAt)}</td>
                <td class="record-time">${record.timeText || formatTime(Number(record.timeMs) || 0)}</td>
                <td class="record-speed">${Number(record.speedCpm) || 0} 字符/分钟</td>
                <td class="record-accuracy">${Number(record.accuracy).toFixed(2)}%</td>
                <td class="record-error">${Number(record.errorRate).toFixed(2)}%</td>
                <td class="record-total">${Number(record.typedChars ?? record.requiredChars) || 0}</td>
            `;
            tbody.appendChild(row);
        }
        table.appendChild(tbody);
        tableWrap.appendChild(table);
        recordsContent.appendChild(tableWrap);
    }

    async function readAndShowRecords() {
        const entry = fileEntries.find(item => item.id === activeFileId);
        if (!entry) {
            folderStatus.textContent = '请先选择一个 CPP 或 TXT 文件。';
            return;
        }

        let fileRecords = [];
        if (currentDirectoryHandle) {
            const granted = await requestDirectoryPermission(currentDirectoryHandle, 'readwrite');
            if (granted) {
                try {
                    fileRecords = await readRecordFile(currentDirectoryHandle);
                } catch (error) {
                    folderStatus.textContent = `读取记录文件失败：${error.message || error}`;
                }
            }
        }

        const allRecords = mergeRecords(fileRecords, getLocalRecords());
        const matched = allRecords.filter(record => normalizeName(record.fileName) === normalizeName(entry.name));
        renderRecords(matched, entry.name);
        recordsModal.style.display = 'flex';
    }

    readRecordsBtn.addEventListener('click', readAndShowRecords);

    document.getElementById('close-modal-btn').addEventListener('click', () => {
        completionModal.style.display = 'none';
        window.focus();
    });

    document.getElementById('close-records-modal-btn').addEventListener('click', () => {
        recordsModal.style.display = 'none';
        window.focus();
    });

    recordsModal.addEventListener('click', event => {
        if (event.target === recordsModal) recordsModal.style.display = 'none';
    });

    window.addEventListener('DOMContentLoaded', async () => {
        renderFingerGuide();
        renderKeyboard();

        const defaultEntry = makeFileEntry({
            name: '默认示例.cpp',
            path: '默认示例.cpp',
            text: defaultText
        });
        replaceFileEntries([defaultEntry]);
        await restoreAndAutoLoadDirectory();
    });
</script>

<script>
(function () {
    var back = document.getElementById('tc-back');
    var fs = document.getElementById('tc-fs');
    var exitfs = document.getElementById('tc-exitfs');
    if (back) back.addEventListener('click', function () {
        try { window.parent.postMessage('kuaioj:typing:exit', '*'); } catch (e) {}
    });
    function enterFs() {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
    function exitFs() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    if (fs) fs.addEventListener('click', enterFs);
    if (exitfs) exitfs.addEventListener('click', exitFs);
    function sync() {
        var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        document.body.classList.toggle('tc-fullscreen', isFs);
        if (fs) fs.style.display = isFs ? 'none' : '';
        if (exitfs) exitfs.style.display = isFs ? '' : 'none';
    }
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
})();
</script>
