<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>键域防线</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000; color: #d6dae0; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    user-select: none;
  }
  #game { position: relative; width: 100vw; height: 100vh; }
  #bgCanvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  @keyframes shakeBig {
    0%   { transform: translate(0, 0); }
    15%  { transform: translate(-14px, 10px); }
    30%  { transform: translate(12px, -9px); }
    45%  { transform: translate(-10px, -8px); }
    60%  { transform: translate(9px, 7px); }
    75%  { transform: translate(-6px, -4px); }
    100% { transform: translate(0, 0); }
  }
  #game.shakeBig { animation: shakeBig .35s ease; }

  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; gap: 22px; padding: 12px 18px;
    font-size: 13px; color: #79808c; letter-spacing: .5px;
  }
  #hud b { color: #d6dae0; font-weight: 600; }

  .char {
    position: absolute; line-height: 1; font-weight: 600; z-index: 24;
    font-family: "Courier New", Consolas, "SFMono-Regular", monospace; color: #8b93a3;
    transition: color .08s, opacity .3s;
  }
  .char.target { color: #ffd24a; text-shadow: 0 0 10px rgba(255,210,74,.55); }
  .char.done { color: #46c08a; }
  .char.vanish { opacity: 0; transition: opacity .9s ease; }
  .char.missed { color: #e05a5a; opacity: .5; }
  .char.skipped { color: #e8a33d; opacity: .85; animation: tumble .9s ease-in forwards; }
  @keyframes tumble {
    from { transform: translateY(0) rotate(0deg); opacity: .85; }
    to   { transform: translateY(1600px) rotate(720deg); opacity: 0; }
  }
  .char.tocannon { color: #e05a5a; animation: tocannon .8s ease-in forwards; }
  @keyframes tocannon {
    from { transform: translate(0,0) rotate(0deg); opacity: .95; }
    to   { transform: translate(var(--dx), var(--dy)) rotate(540deg); opacity: .55; }
  }
  .particle {
    position: absolute; width: 5px; height: 5px; border-radius: 50%;
    background: #ffd24a; z-index: 21; pointer-events: none;
    animation: burst .5s ease-out forwards;
  }
  @keyframes burst {
    from { transform: translate(0, 0) scale(1); opacity: 1; }
    to   { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; }
  }

  #cannon { position: absolute; left: 50%; bottom: 30px; width: 0; height: 0; z-index: 22; }
  #playerHPBar {
    position: absolute; bottom: 42px; left: 30px; width: 80px; height: 16px;
    background: rgba(224,90,90,.3); border-radius: 4px; overflow: hidden; z-index: 23;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #playerHPFill {
    height: 100%; background: #46c08a; border-radius: 3px;
    transition: width .2s ease, background .2s ease;
  }
  #hpText {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    text-align: center; font: 700 11px/16px system-ui; color: #fff;
    text-shadow: 0 0 3px rgba(0,0,0,0.8); z-index: 2;
  }
  .item-f1-wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 5px;
  }
  #energyBar {
    position: static; display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 4px; height: 8px; margin: 0; z-index: 23;
  }
  .energy-cell {
    width: 8px; height: 6px; border-radius: 2px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    transition: all .2s ease;
  }
  .energy-cell.filled {
    background: linear-gradient(90deg, #ff6b3d, #e05a5a);
    border-color: #ff6b3d;
    box-shadow: 0 0 6px rgba(255,107,61,.7);
  }
  .energy-cell.full {
    background: linear-gradient(90deg, #ffd24a, #ff6b3d);
    border-color: #ffd24a;
    box-shadow: 0 0 10px rgba(255,210,74,.8);
    animation: energyPulse .6s ease-in-out infinite alternate;
  }
  @keyframes energyPulse { from { box-shadow: 0 0 6px rgba(255,210,74,.5); } to { box-shadow: 0 0 14px rgba(255,210,74,1); } }
  #energyLabel { display: none !important; }
  .energy-orb {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle, #ffd24a 0%, #ff6b3d 60%, rgba(255,107,61,0) 100%);
    box-shadow: 0 0 12px rgba(255,210,74,.8), 0 0 20px rgba(255,107,61,.5);
    z-index: 26; pointer-events: none;
    transition: left 1.1s cubic-bezier(.4,1,.6,1), top 1.1s cubic-bezier(.4,1,.6,1), transform 1.1s ease, opacity .2s ease .9s;
  }
  .mega-laser {
    position: absolute; height: 8px; background: linear-gradient(90deg, #ff2020, #ff6040, #ff2020);
    border-radius: 4px; transform-origin: left center;
    box-shadow: 0 0 16px rgba(255,32,32,.9), 0 0 30px rgba(255,32,32,.5);
    z-index: 25; pointer-events: none;
    animation: megaLaserFade .5s ease-out forwards;
  }
  @keyframes megaLaserFade { from { opacity: 1; } to { opacity: 0; } }
  #defenseLine {
    position: absolute; left: 0; right: 0; height: 0; z-index: 20;
    border-top: 2px dashed rgba(224,90,90,.55);
    pointer-events: none; display: none;
  }
  #base {
    position: absolute; bottom: -16px; left: -28px; width: 56px; height: 30px;
    background: linear-gradient(#3c4452, #20252e);
    border: 2px solid #4c5564; border-radius: 10px 10px 16px 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,.5);
  }
  #base::before {
    content: ''; position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 30px; height: 22px; background: linear-gradient(#4a5260, #2c333d);
    border: 2px solid #4c5564; border-radius: 50% 50% 0 0;
  }
  #barrel {
    position: absolute; bottom: 6px; left: -8px; width: 16px; height: 46px;
    background: linear-gradient(90deg, #2f9e74 0%, #57d79f 45%, #2f9e74 100%);
    border-radius: 8px 8px 3px 3px;
    transform-origin: bottom center; transition: transform .05s linear;
    box-shadow: inset 0 0 5px rgba(0,0,0,.35);
  }
  .flash {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #7fdcff 40%, rgba(77,166,255,0) 70%);
    transform: translate(-50%, -50%); z-index: 5; pointer-events: none;
    animation: flash .18s ease-out forwards;
  }
  @keyframes flash {
    from { opacity: .95; transform: translate(-50%,-50%) scale(.4); }
    to   { opacity: 0;   transform: translate(-50%,-50%) scale(1.6); }
  }
  .laser {
    position: absolute; height: 3px; background: #4da6ff; border-radius: 2px;
    transform-origin: left center; box-shadow: 0 0 8px rgba(77,166,255,.9);
    animation: fade .18s linear forwards; z-index: 20;
  }
  .laser.wrong {
    background: #e05a5a; box-shadow: 0 0 8px rgba(224,90,90,.9);
  }
  @keyframes fade { from { opacity: .9; } to { opacity: 0; } }

  #reticle {
    position: absolute; width: 34px; height: 34px; z-index: 23; pointer-events: none;
    border: 2px solid rgba(63,208,255,.9); border-radius: 50%;
    transform: translate(-50%, -50%); display: none;
    box-shadow: 0 0 6px rgba(63,208,255,.5);
  }
  #reticle::before, #reticle::after { content: ''; position: absolute; background: rgba(63,208,255,.5); }
  #reticle::before { left: 50%; top: -9px; width: 1px; height: 52px; transform: translateX(-50%); }
  #reticle::after  { top: 50%; left: -9px; height: 1px; width: 52px; transform: translateY(-50%); }

  #retreatMsg {
    position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    font-size: 28px; font-weight: 700; color: #ffd24a;
    text-shadow: 0 0 12px rgba(255,210,74,.6); z-index: 25;
    display: none; pointer-events: none; letter-spacing: 6px;
    animation: retreatPulse .6s ease-in-out infinite alternate;
  }
  @keyframes retreatPulse { from { opacity: .6; } to { opacity: 1; } }

  #itemMsg {
    position: absolute; left: 50%; bottom: 160px; transform: translateX(-50%);
    font-size: 26px; font-weight: 700; color: #46c08a;
    text-shadow: 0 0 12px rgba(70,192,138,.6); z-index: 35;
    display: none; pointer-events: none; letter-spacing: 2px;
    animation: itemPulse .4s ease-in-out infinite alternate;
  }

  /* 时缓倒计时与“获得道具”采用完全一致的提示视觉 */
  #slowTimer {
    position: absolute; left: 50%; bottom: 160px; transform: translateX(-50%);
    font-size: 26px; font-weight: 700; color: #46c08a;
    text-shadow: 0 0 12px rgba(70,192,138,.6); z-index: 35;
    display: none; pointer-events: none; letter-spacing: 2px;
    animation: itemPulse .4s ease-in-out infinite alternate;
    white-space: nowrap;
  }
  @keyframes itemPulse { from { opacity: .7; } to { opacity: 1; } }

  #itemPanel {
    position: absolute; right: 30px; bottom: 30px; z-index: 35;
    display: flex; gap: 15px;
  }
  .item-box {
    background: rgba(0, 0, 0, 0.6); border: 1px solid #3a404c;
    border-radius: 8px; padding: 10px 12px; min-width: 68px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    color: #c2c8d2; font-size: 13px; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .item-box .icon { font-size: 26px; line-height: 1; margin-bottom: 2px; }
  .item-box.heal-item .icon { color: #ff4d67; text-shadow: 0 0 10px rgba(255,77,103,.72); }
  .item-box .key { 
    background: #46c08a; color: #10121a; padding: 2px 8px; 
    border-radius: 4px; font-size: 12px; font-family: system-ui; letter-spacing: 0;
  }
  .item-box.disabled { opacity: 0.4; filter: grayscale(1); border-color: #3a404c; }
  .item-box.used { opacity: 0; transform: translateY(20px) scale(0.7); pointer-events: none; }

  .word { position: absolute; z-index: 2; display: flex; flex-direction: column; align-items: center; }
  .word.retreating { transition: top .6s linear; }
  
  /* 错误变红状态：飞机标红指示不可被炸弹摧毁，不掉落道具 */
  .word.failed .plane-svg path { stroke: #ff3333 !important; fill: rgba(255,51,51,0.2) !important; filter: drop-shadow(0 0 4px #ff0000); }
  .word.failed .wbar { display: none; }
  
  .plane { position: relative; width: var(--w); height: calc(var(--w) / 1.077); }
  .plane-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(180deg) scale(var(--planescale, 1)); transform-origin: center center; transition: transform .25s ease; pointer-events: none; }
  .plane-svg path { fill: rgba(255,255,255,0.04); stroke: rgba(214,222,234,0.7); stroke-width: calc(var(--u) * 0.07); vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; transition: stroke .3s ease, fill .3s ease; }
  .word.missed .plane-svg path { fill: rgba(224,90,90,0.08); stroke: rgba(224,90,90,0.85); }
  .word.missed .wchar { color: #e05a5a; }
  
  /* 道具随飞机缩放：尺寸、机头相对位置、边框与光晕都跟随飞机当前比例 */
  .plane-reward-icon {
    position: absolute; left: 50%; bottom: var(--reward-bottom, 13%); transform: translateX(-50%);
    font-size: var(--reward-font, 17px); z-index: 25; background: rgba(0,0,0,0.72);
    border: var(--reward-border, 1px) solid #46c08a; border-radius: 50%;
    width: var(--reward-size, 28px); height: var(--reward-size, 28px);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 var(--reward-glow, 8px) rgba(70,192,138,0.65);
    animation: noseRewardPulse 1.6s ease-in-out infinite; pointer-events: none;
    will-change: transform, width, height, bottom;
  }
  @keyframes noseRewardPulse { 0%, 100% { transform: translateX(-50%) scale(.94); } 50% { transform: translateX(-50%) scale(1.06); } }

  .wletters { position: absolute; left: 50%; top: 51%; transform: translate(-50%, -50%); display: flex; font-family: "Courier New", Consolas, monospace; font-weight: 600; font-size: var(--fs); z-index: 2; }
  .wchar { width: var(--cw); text-align: center; color: #d6dae0; transition: color .08s, width .18s ease; white-space: pre; }
  .wchar.space { color: #5b6472; font-weight: 700; }
  .wchar.target { color: #ffd24a; text-shadow: 0 0 10px rgba(255,210,74,.6); }
  /* 正确输入的字符宽度塌陷隐藏 */
  .wchar.done, .wchar.gone { width: 0; overflow: hidden; color: #46c08a; animation: wfade .5s ease forwards; }
  /* 错误输入的字符保持原宽、变红跟随 */
  .wchar.wrong { color: #ff3333 !important; text-shadow: 0 0 5px rgba(255,51,51,0.6); font-weight: bold; }
  
  @keyframes wfade { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-8px); } }
  .word .wbar { position: absolute; top: 3px; right: 3px; width: calc(var(--w) * 0.25); height: 4px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; transition: width .15s ease, top .15s ease, right .15s ease; }
  .wbar-fill { height: 100%; background: #46c08a; transition: width .15s ease, background .15s ease; }
  .word.killed { opacity: 0; transition: opacity .15s ease; pointer-events: none; }
  .word.pre-explode { pointer-events: none; }
  .word.pre-explode .plane-svg path { stroke: #e05a5a !important; fill: rgba(224,90,90,0.12) !important; }
  .word.pre-explode .plane { animation: planeShake .5s ease-in-out; }
  @keyframes planeShake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    15% { transform: translate(-3px, 1px) rotate(-1deg); }
    30% { transform: translate(3px, -1px) rotate(1deg); }
    45% { transform: translate(-4px, -2px) rotate(-2deg); }
    60% { transform: translate(4px, 2px) rotate(2deg); }
    75% { transform: translate(-3px, 2px) rotate(-1deg); }
    90% { transform: translate(3px, -1px) rotate(1deg); }
  }
  .word.final-shaking { pointer-events: none; }
  .word.final-shaking .plane-svg path { stroke: #e05a5a !important; fill: rgba(224,90,90,0.15) !important; }
  .shard-char {
    position: absolute; z-index: 26; pointer-events: none;
    font-family: "Courier New", Consolas, monospace; font-weight: 700;
    animation: shardFly 1.6s ease-out forwards;
  }
  @keyframes shardFly {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.3); opacity: 0; }
  }
  #cannon.exploding { pointer-events: none; }
  #cannon.exploding #base { animation: baseBreak 1.2s ease-in forwards; }
  #cannon.exploding #barrel { animation: barrelBreak 1.2s ease-in forwards; }
  #cannon.exploding #playerHPBar { animation: uiBreak 1.2s ease-in forwards; }
  #cannon.exploding ~ #itemPanel #energyBar, #cannon.exploding ~ #energyLabel { animation: uiBreak 1.2s ease-in forwards; }
  @keyframes baseBreak {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    30%  { transform: translate(-4px, -8px) rotate(-8deg); opacity: 1; }
    100% { transform: translate(-60px, 120px) rotate(-120deg); opacity: 0; }
  }
  @keyframes barrelBreak {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    30%  { transform: translate(4px, -10px) rotate(10deg); opacity: 1; }
    100% { transform: translate(50px, 100px) rotate(140deg); opacity: 0; }
  }
  @keyframes uiBreak {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    30%  { transform: translate(8px, -6px) rotate(12deg); opacity: 1; }
    100% { transform: translate(40px, 110px) rotate(80deg); opacity: 0; }
  }
  .overlay {
    position: absolute; inset: 0; z-index: 100;
    background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 26px; font-weight: 600; letter-spacing: 3px; color: #eef0f3; }
  .overlay p { color: #79808c; font-size: 13px; }
  .stats-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px 16px;
    margin: 4px 0 8px; min-width: 260px;
  }
  .stat-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: 10px;
    background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
  }
  .stat-icon { font-size: 18px; line-height: 1; flex-shrink: 0; }
  .stat-body { display: flex; flex-direction: column; gap: 1px; }
  .stat-label { font-size: 11px; color: #79808c; letter-spacing: .5px; }
  .stat-value { font: 700 18px/1 system-ui; color: #eef0f3; }
  .stat-value.green { color: #46c08a; }
  .stat-value.gold { color: #ffd24a; }
  .stat-value.red { color: #e05a5a; }
  .end-time { font-size: 12px; color: #5b6472; letter-spacing: 1px; margin-top: 2px; }
  .btns { display: flex; gap: 12px; }
  button {
    font: 600 14px/1 system-ui; padding: 12px 24px; border: none; border-radius: 8px;
    background: #46c08a; color: #10121a; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost { background: transparent; color: #c2c8d2; border: 1px solid #3a404c; }
  #fileInput { display: none; }
  /* 作战等级：与雷达战术主题统一 */
  .levels {
    display: grid; grid-template-columns: repeat(3, 112px); gap: 8px;
    padding: 6px; border: 1px solid rgba(70,192,138,.18); border-radius: 12px;
    background: linear-gradient(180deg, rgba(10,18,27,.74), rgba(4,9,15,.86));
    box-shadow: inset 0 0 22px rgba(63,208,255,.025), 0 8px 24px rgba(0,0,0,.18);
  }
  .lvl {
    position: relative; min-height: 48px; padding: 7px 10px 7px 12px; text-align: left;
    border: 1px solid rgba(121,128,140,.32); border-radius: 8px;
    background: linear-gradient(135deg, rgba(255,255,255,.025), rgba(255,255,255,.008));
    color: #aab2bf; cursor: pointer; overflow: hidden;
    transition: border-color .18s ease, background .18s ease, box-shadow .18s ease, transform .18s ease;
  }
  .lvl::before {
    content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px;
    border-radius: 2px; background: rgba(91,100,114,.55); transition: all .18s ease;
  }
  .lvl::after {
    content: ''; position: absolute; right: 8px; top: 8px; width: 5px; height: 5px;
    border: 1px solid rgba(121,128,140,.55); border-radius: 50%;
    box-shadow: 0 0 0 rgba(70,192,138,0); transition: all .18s ease;
  }
  .lvl-name { display: block; font: 700 12px/1.05 system-ui; letter-spacing: 1px; color: #c9d0da; }
  .lvl-speed { display: block; margin-top: 6px; font: 600 9px/1 system-ui; letter-spacing: .7px; color: #66717f; }
  .lvl:hover {
    border-color: rgba(70,192,138,.6); background: rgba(70,192,138,.045); transform: translateY(-1px);
  }
  .lvl.active {
    border-color: #46c08a; background: linear-gradient(135deg, rgba(70,192,138,.16), rgba(63,208,255,.04));
    box-shadow: inset 0 0 16px rgba(70,192,138,.045), 0 0 12px rgba(70,192,138,.11);
  }
  .lvl.active::before { background: #46c08a; box-shadow: 0 0 8px rgba(70,192,138,.8); }
  .lvl.active::after { background: #46c08a; border-color: #6ee0af; box-shadow: 0 0 7px rgba(70,192,138,.8); }
  .lvl.active .lvl-name { color: #6ee0af; }
  .lvl.active .lvl-speed { color: #8aaf9f; }

  /* 战术雷达风格的模式二选一 */
  #modeSelectionBox {
    margin-top: 16px; display: flex; align-items: stretch; justify-content: center; gap: 10px;
    padding: 5px; border: 1px solid rgba(70,192,138,.22); border-radius: 12px;
    background: linear-gradient(180deg, rgba(12,20,29,.78), rgba(5,10,16,.88));
    box-shadow: inset 0 0 22px rgba(63,208,255,.035), 0 8px 24px rgba(0,0,0,.22);
  }
  .mode-option { position: relative; cursor: pointer; }
  .mode-option input { position: absolute; opacity: 0; pointer-events: none; }
  .mode-card {
    min-width: 124px; height: 46px; padding: 6px 13px; border-radius: 9px;
    border: 1px solid rgba(121,128,140,.38); background: rgba(255,255,255,.025);
    display: grid; grid-template-columns: 22px 1fr; grid-template-rows: 1fr 1fr;
    column-gap: 7px; align-items: center; color: #8f99a7; transition: all .18s ease;
  }
  .mode-symbol { grid-row: 1 / 3; font-size: 14px; line-height: 1; text-align: center; opacity: .72; }
  .mode-name { align-self: end; font: 700 13px/1 system-ui; letter-spacing: 1px; color: #c2c8d2; }
  .mode-desc { align-self: start; margin-top: 4px; font: 500 9px/1 system-ui; letter-spacing: .5px; color: #66707d; }
  .mode-option:hover .mode-card { border-color: rgba(70,192,138,.65); background: rgba(70,192,138,.05); }
  .mode-option input[value="normal"]:checked + .mode-card {
    border-color: #46c08a; background: linear-gradient(135deg, rgba(70,192,138,.16), rgba(63,208,255,.045));
    box-shadow: inset 0 0 18px rgba(70,192,138,.06), 0 0 14px rgba(70,192,138,.13);
  }
  .mode-option input[value="normal"]:checked + .mode-card .mode-symbol,
  .mode-option input[value="normal"]:checked + .mode-card .mode-name { color: #6ee0af; opacity: 1; }
  .mode-option input[value="item"]:checked + .mode-card {
    border-color: #d8ad45; background: linear-gradient(135deg, rgba(255,210,74,.15), rgba(255,107,61,.045));
    box-shadow: inset 0 0 18px rgba(255,210,74,.05), 0 0 14px rgba(255,210,74,.12);
  }
  .mode-option input[value="item"]:checked + .mode-card .mode-symbol,
  .mode-option input[value="item"]:checked + .mode-card .mode-name { color: #ffd24a; opacity: 1; }
  #customSpeedBox { display: none; align-items: center; gap: 8px; justify-content: center; margin-top: 10px; }
  #customSpeedBox span.lbl { font: 600 13px/1 system-ui; color: #c2c8d2; }
  #customSpeedBox span.range { font: 600 12px/1 system-ui; color: #9aa3b2; }
  #customSpeed { width: 70px; font: 600 14px/1 system-ui; padding: 7px 8px; border: 1px solid #3a404c; border-radius: 8px; background: transparent; color: #eef0f3; text-align: center; outline: none; }
  #customSpeed:focus { border-color: #46c08a; }
  .hint { color: #ffd24a; font-size: 13px; min-height: 18px; }
  .hint:empty { display: none; }
  
  /* 按钮拉开间隙，避免重叠 */
  #exitBtn {
    position: absolute; top: 12px; right: 64px; z-index: 110;
    font: 600 12px/1 system-ui; padding: 7px 14px; border-radius: 8px;
    background: rgba(0,0,0,.4); color: #c2c8d2; border: 1px solid #3a404c; cursor: pointer;
    transition: all .15s; display: none;
  }
  #exitBtn:hover { border-color: #e05a5a; color: #e05a5a; }

  #muteBtn {
    position: absolute; top: 12px; right: 16px; z-index: 110;
    font: 600 12px/1 system-ui; padding: 7px 12px; border-radius: 8px;
    background: rgba(0,0,0,.4); color: #c2c8d2; border: 1px solid #3a404c; cursor: pointer;
    transition: all .15s;
  }
  #muteBtn:hover { border-color: #46c08a; color: #46c08a; }

  /* 左下角信息区：快捷键在上，战术提示在下 */
  #lowerLeftInfo {
    position: absolute; left: 20px; bottom: 20px; z-index: 100;
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;

  }
  #hotkeyHint {
    font-size: 13px; color: #79808c; letter-spacing: 1px; font-weight: 600;

  }
  #gameRuleHint {
    display: none; font-size: 13px; line-height: normal;

  }
  #gameRuleHint.show { display: block; }
  #gameRuleHint b { color: inherit; font-weight: inherit; }

  #comboPop {
    position: absolute; left: calc(50% - 110px); bottom: 70px; z-index: 24;

  }
  #comboPop .num { display: block; font: 800 38px/1 system-ui; color: #ffd24a; text-shadow: 0 0 14px rgba(255,210,74,.65); }
  #comboPop .lbl { display: block; font: 600 12px/1 system-ui; color: #9aa3b2; letter-spacing: 3px; margin-top: 2px; }
  #comboPop.show { opacity: 1; animation: comboPop .32s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes comboPop {
    0%   { transform: scale(.5);  opacity: 0; }

  #typer { position: fixed; left: 8px; bottom: 6px; width: 1px; height: 1px; opacity: 0; border: 0; margin: 0; padding: 0; background: transparent; color: transparent; font-size: 16px; outline: none; z-index: -1; }

  .explosion-flash {

<body>
<div id="game">
  <canvas id="bgCanvas" width="1552" height="874"></canvas>
  <div id="hud">
    <span style="display:none">得分 <b id="score">0</b></span>
    <span style="display:none">连击 <b id="combo">0</b></span>
    <span style="display:none">受击 <b id="hitsTaken">0</b></span>
    <span>进度 <b id="progress">0%</b></span>
  </div>
  <div id="cannon" style="display: none;">
    <div id="playerHPBar"><div id="playerHPFill"></div><span id="hpText">20/20</span></div>
    <div id="base"></div>
    <div id="barrel"></div>
  </div>
  <div id="energyLabel" style="display: none;">F1</div>
  <div id="reticle"></div>
  <div id="retreatMsg">全体后退</div>
  <div id="itemMsg"></div>
  <div id="slowTimer">时间缓慢 5 秒</div>
  <div id="defenseLine"></div>
  <div id="comboPop"></div>
  
  <div id="itemPanel" style="display: none;">
    <div class="item-f1-wrap">

      <div id="energyBar" style="display: none;"></div>
    </div>
    <div id="item-f2" class="item-box disabled"><span class="icon">⏳</span><span class="key">F2</span>时缓</div>
    <div id="item-f3" class="item-box disabled"><span class="icon">💣</span><span class="key">F3</span>炸弹</div>
    <div id="item-f4" class="item-box disabled"><span class="icon">💨</span><span class="key">F4</span>后退</div>
    <div id="item-f5" class="item-box disabled"><span class="icon">🤖</span><span class="key">F5</span>连击</div>
    <div id="item-f6" class="item-box disabled heal-item"><span class="icon">♥</span><span class="key">F6</span>回复</div>
  </div>

  <button id="exitBtn" aria-hidden="true" tabindex="-1">返回主页</button>
  <div class="typing-ctrl" role="group" aria-label="页面控制">
    <button class="tc-btn tc-icon-btn" id="muteBtn" aria-pressed="true" aria-label="关闭声音" title="关闭声音">🔊</button>
    <button class="tc-btn tc-icon-btn" id="tc-back" aria-label="返回主页" title="返回主页">⌂</button>
    <button class="tc-btn tc-icon-btn" id="tc-fs" aria-label="全屏显示" title="全屏显示">⛶</button>
    <button class="tc-btn tc-icon-btn" id="tc-exitfs" aria-label="退出全屏" title="退出全屏" style="display:none">⤢</button>
  </div>
  <div id="lowerLeftInfo">
    <div id="hotkeyHint">ESC: 返回主页 &nbsp;&nbsp;|&nbsp;&nbsp; Enter: 开始/重开</div>
    <div id="gameRuleHint">提示：使用 <b>F1～F6 道具</b> 消灭或自动处理的飞机，<b>无法获得该机携带的道具</b></div>
  </div>
  
  <input id="typer" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="none" readonly tabindex="-1" aria-hidden="true" style="ime-mode: disabled;">

  <div id="startScreen" class="overlay">
    <h1>键域防线</h1>
    <div class="levels" id="levels"></div>
    <div id="customSpeedBox"><span class="lbl">打字速度</span><input type="number" id="customSpeed" min="10" max="400" value="80"><span class="range">(10-400)</span></div>
    
    <!-- 模式二选一：战术雷达风格 -->
    <div id="modeSelectionBox">
      <label class="mode-option">
        <input type="radio" name="gameMode" value="normal" checked>
        <span class="mode-card">
          <span class="mode-symbol">◎</span><span class="mode-name">普通模式</span><span class="mode-desc">标准拦截</span>
        </span>
      </label>
      <label class="mode-option">
        <input type="radio" name="gameMode" value="item">
        <span class="mode-card">
          <span class="mode-symbol">◆</span><span class="mode-name">道具模式</span><span class="mode-desc">战术增强</span>
        </span>
      </label>

    <p class="hint" id="hint"></p>

      <button id="startBtn">开始游戏</button>

    <input type="file" id="fileInput" accept=".cpp,.py,.c,.h,.hpp,.cc,.js,.ts,.java,.go,.rs,.txt">
  </div>

  <div id="endScreen" class="overlay hidden">

      <button id="againBtn">再来一次</button>
      <button id="menuBtn" class="ghost">返回主页</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const game = $('#game'), barrel = $('#barrel'), reticle = $('#reticle'), defenseLine = $('#defenseLine'), retreatMsg = $('#retreatMsg');
const scoreEl = $('#score'), comboEl = $('#combo'), hitsTakenEl = $('#hitsTaken'), progEl = $('#progress');
const comboPop = $('#comboPop');
const startScreen = $('#startScreen'), endScreen = $('#endScreen'), fileInput = $('#fileInput');
const cannonEl = $('#cannon'), energyBarEl = $('#energyBar'), energyLabelEl = $('#energyLabel');

function showGameUI(show) {
  cannonEl.style.display = show ? '' : 'none';
  energyBarEl.style.display = (show && itemModeEnabled) ? '' : 'none';
  energyLabelEl.style.display = 'none';
  $('#exitBtn').style.display = show ? 'block' : 'none';
  const gameRuleHint = $('#gameRuleHint');
  if (gameRuleHint) gameRuleHint.classList.toggle('show', !!show && itemModeEnabled);
  if (!show && $('#itemPanel')) $('#itemPanel').style.display = 'none';
}

const DEFAULT = `#include <iostream>\nusing namespace std;\nint main() {\n    cout << "hello, world!" << endl;\n    return 0;\n}`;

const LEVELS = [
  { name: '蒟蒻', speed: 20 },
  { name: '入门', speed: 60 },
  { name: '正常', speed: 100 },
  { name: '高手', speed: 140 },
  { name: '巨佬', speed: 180 },
  { name: '自定义', speed: 0 },
];
let selectedLevel = 1; // 默认选择“入门”难度

function getCustomSpeed() {
  const input = $('#customSpeed');
  const v = parseInt((input || {}).value);
  if (isNaN(v)) return 80;
  return Math.max(10, Math.min(400, v));
}

function clampCustomSpeedInput() {
  const input = $('#customSpeed');
  if (!input || input.value === '') return;
  input.value = String(getCustomSpeed());
}

function renderLevels() {
  const box = $('#levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button');
    b.className = 'lvl' + (i === selectedLevel ? ' active' : '');
    const speedLabel = lv.name === '自定义' ? 'CUSTOM SPEED' : `SPEED ${lv.speed}`;
    b.innerHTML = `<span class="lvl-name">${lv.name}</span><span class="lvl-speed">${speedLabel}</span>`;
    b.onclick = () => {
      selectedLevel = i; // 切换关卡只改变速度，不清除已经导入的程序
      box.querySelectorAll('.lvl').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const csBox = $('#customSpeedBox');
      if (csBox) csBox.style.display = (lv.name === '自定义') ? 'flex' : 'none';
      $('#hint').textContent = '';
    };
    box.appendChild(b);
  });
  const csInput = $('#customSpeed');
  if (csInput && !csInput.dataset.clampBound) {
    csInput.dataset.clampBound = '1';
    csInput.addEventListener('input', () => { $('#hint').textContent = ''; });
    csInput.addEventListener('change', clampCustomSpeedInput);
    csInput.addEventListener('blur', clampCustomSpeedInput);
  }
}

let CODE = DEFAULT;
let usingImportedCode = false;
let words = [], wIdx = 0, nextWait = 0, totalChars = 0, typedCount = 0;
let score = 0, combo = 0, maxCombo = 0, hits = 0, miss = 0, kills = 0;
let playerHP = 20, playerMaxHP = 20;
const MAX_ENERGY = 5;
let energy = 0;
let running = false, lastT = 0, startT = 0, raf = 0;
let targetCharEl = null;
let CW = 26, FH = 32, FS = 23, STEP = 22, SPEED = 70, MAXFALL = 12;
let BASE_SPEED = SPEED;
let slowTimerInterval = null;
let slowTimerTimeout = null;
let slowModeActive = false;
const PLANE_ASPECT = 1.077;
let cx = 0, cy = 0, MISSY = 0;
let actx = null;
let soundOn = true;

let itemModeEnabled = false;
let itemF2Owned = false, itemF3Owned = false, itemF4Owned = false, itemF5Owned = false, itemF6Owned = false;
// 道具掉落节流：避免连续多架飞机都携带道具
let itemRewardGap = 99;
let itemMsgTimer = null;

// ============ 雷达战术网格背景渲染模块 ============
const bgCanvas = document.getElementById('bgCanvas');
const bgCtx = bgCanvas.getContext('2d');
let bgStars = [];
let bgRetreat = false, bgLastT = 0, bgRaf = 0;
let bgOffset = 0;
let bgPlanes = [];
let gameSessionId = 0;

function makeBgPlane(resetAbove = false) {
  return {
    x: Math.random() * innerWidth,
    y: resetAbove ? (-30 - Math.random() * 180) : Math.random() * innerHeight,
    size: 8 + Math.random() * 10,
    speed: 18 + Math.random() * 28,
    drift: (Math.random() - 0.5) * 10,
    alpha: 0.18 + Math.random() * 0.28
  };
}


function initBg() {
  bgCanvas.width = innerWidth; bgCanvas.height = innerHeight;
  bgStars = [];
  bgPlanes = [];
  for (let i = 0; i < 60; i++) {
    const brightness = Math.random();
    bgStars.push({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight,
      size: brightness * 1.5 + 1.0, alpha: brightness * 0.5 + 0.2, speedMul: brightness * 1.0 + 0.5,
      twinkle: Math.random() * 0.04 + 0.02, twinkleOffset: Math.random() * Math.PI * 2
    });
  }
  for (let i = 0; i < 11; i++) bgPlanes.push(makeBgPlane(false));
}

function drawBg(dt) {
  bgCtx.fillStyle = '#060a12';
  bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
  
  const speed = running ? SPEED : 30;
  const dir = bgRetreat ? -1 : 1;
  bgOffset += speed * dt * 0.5 * dir;

  const gridSize = 60;
  bgCtx.lineWidth = 1;
  bgCtx.strokeStyle = 'rgba(47, 158, 116, 0.15)'; 
  
  bgCtx.beginPath();
  const startY = bgOffset % gridSize;
  for (let y = startY - gridSize; y < bgCanvas.height; y += gridSize) {
    bgCtx.moveTo(0, y); bgCtx.lineTo(bgCanvas.width, y);
  }
  const midX = bgCanvas.width / 2;
  for (let x = midX % gridSize; x < bgCanvas.width; x += gridSize) {
    bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height);
  }
  for (let x = midX % gridSize - gridSize; x >= 0; x -= gridSize) {
    bgCtx.moveTo(x, 0); bgCtx.lineTo(x, bgCanvas.height);
  }
  bgCtx.stroke();

  bgCtx.strokeStyle = 'rgba(63, 208, 255, 0.12)';
  bgCtx.beginPath();
  bgCtx.arc(midX, bgCanvas.height, 300, 0, Math.PI * 2);
  bgCtx.stroke();
  bgCtx.beginPath();
  bgCtx.arc(midX, bgCanvas.height, 600, 0, Math.PI * 2);
  bgCtx.stroke();

  const now = Date.now() * 0.003;
  for (const s of bgStars) {
    s.y += speed * dt * s.speedMul * dir;
    if (s.y > bgCanvas.height + 5) { s.y = -5; s.x = Math.random() * innerWidth; }
    else if (s.y < -5) { s.y = bgCanvas.height + 5; s.x = Math.random() * innerWidth; }
    const tw = 0.5 + 0.5 * Math.sin(now * s.twinkle * 10 + s.twinkleOffset);
    bgCtx.fillStyle = `rgba(70, 192, 138, ${s.alpha * tw})`;
    bgCtx.fillRect(s.x, s.y, s.size * 2, s.size * 2);
  }

  // 主页专属的小型巡航飞机，只作为背景装饰，不参与游戏判定
  const onHome = !running && !startScreen.classList.contains('hidden');
  if (onHome) {
    bgCtx.save();
    bgCtx.lineWidth = 1.2;
    for (let i = 0; i < bgPlanes.length; i++) {
      const p = bgPlanes[i];
      p.y += p.speed * dt;
      p.x += p.drift * dt;
      if (p.y > bgCanvas.height + 28 || p.x < -40 || p.x > bgCanvas.width + 40) bgPlanes[i] = makeBgPlane(true);
      const q = bgPlanes[i];
      bgCtx.save();
      bgCtx.translate(q.x, q.y);
      bgCtx.globalAlpha = q.alpha;
      bgCtx.strokeStyle = 'rgba(116, 203, 255, .85)';
      bgCtx.beginPath();
      bgCtx.moveTo(0, q.size);
      bgCtx.lineTo(-q.size * .20, q.size * .12);
      bgCtx.lineTo(-q.size * .78, -q.size * .08);
      bgCtx.lineTo(-q.size * .78, -q.size * .28);
      bgCtx.lineTo(-q.size * .15, -q.size * .08);
      bgCtx.lineTo(0, -q.size * .72);
      bgCtx.lineTo(q.size * .15, -q.size * .08);
      bgCtx.lineTo(q.size * .78, -q.size * .28);
      bgCtx.lineTo(q.size * .78, -q.size * .08);
      bgCtx.lineTo(q.size * .20, q.size * .12);
      bgCtx.closePath();
      bgCtx.stroke();
      bgCtx.restore();
    }
    bgCtx.restore();
  }

  const grad = bgCtx.createLinearGradient(0, 0, 0, 200);
  grad.addColorStop(0, 'rgba(0,0,0,0.85)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0, 0, bgCanvas.width, 200);
}

function bgLoop(t) { if (!bgLastT) bgLastT = t; const dt = Math.min(0.05, (t - bgLastT) / 1000) || 0; bgLastT = t; drawBg(dt); bgRaf = requestAnimationFrame(bgLoop); }

function normalize(s) {
  const m = { ' ': ' ', '。': '.', '，': ',', '；': ';', '：': ':', '！': '!', '？': '?',
              '（': '(', '）': ')', '“': '"', '”': '"', '‘': "'", '’': "'",
              '【': '[', '】': ']', '《': '<', '》': '>', '—': '-' };
  let out = ''; for (const ch of s) out += (m[ch] || ch); return out;
}

function layout() {
  cx = innerWidth / 2; cy = innerHeight - 36; MISSY = innerHeight - 88;
  if (defenseLine) defenseLine.style.top = MISSY + 'px';
  let maxLen = 1; for (const w of words) if (w.len > maxLen) maxLen = w.len;

const MAX_TOKEN_LEN = 25;
const LONG_TEXT_THRESHOLD = 16; // 16~25 字符视为长字符串飞机

function splitTokenSmart(token, maxLen = MAX_TOKEN_LEN) {
  const out = [];
  const breakChars = /[;,.:()\[\]{}=+\-*\/<>!?&|]/;
  let rest = token;
  while (rest.length > maxLen) {
    let cut = maxLen;
    // 优先在靠近 25 字符的位置按代码符号截断，避免机械硬切。
    for (let i = maxLen - 1; i >= Math.max(8, maxLen - 8); i--) {
      if (breakChars.test(rest[i])) { cut = i + 1; break; }
    }
    out.push(rest.slice(0, cut));
    rest = rest.slice(cut);
  }
  if (rest) out.push(rest);
  return out;
}

function build() {
  words = []; nextWait = 0; totalChars = 0;
  
  let cleanCode = CODE.replace(/\/\*[\s\S]*?\*\//g, '');
  cleanCode = cleanCode.replace(/\/\/.*$/gm, '');
  cleanCode = cleanCode.replace(/[^\x20-\x7E\r\n\t]/g, '');

  let tokens = [];
  const parts = cleanCode.split(/[\s\n\t\r]+/);
  for (const p of parts) {
    if (!p) continue;
    tokens.push(...splitTokenSmart(p));
  }

  // 尽量把孤立的 1 字符代码符号并入相邻短 token，但绝不超过 25 字符。
  let merged = [];
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t.length === 1) {
      if (merged.length > 0 && merged[merged.length - 1].length + 1 <= MAX_TOKEN_LEN) {
        merged[merged.length - 1] += t;
      } else if (i + 1 < tokens.length && t.length + tokens[i + 1].length <= MAX_TOKEN_LEN) {
        tokens[i + 1] = t + tokens[i + 1];
      } else {
        merged.push(t);
      }
    } else {
      merged.push(t);
    }
  }

  if (merged.length === 0) merged = ["EMPTY", "CODE", "FOUND"];

  for (const text of merged) {
    const w = {
      text, len: text.length, hp: text.length, pos: 0, x: 0, y: 0,
      state: 'wait', el: null, charEls: [], itemReward: null, isFailed: false,
      isLongText: text.length >= LONG_TEXT_THRESHOLD
    };
    words.push(w); totalChars += w.len;
  }
}

function render() {
  game.querySelectorAll('.word').forEach(e => e.remove());
  const svgNS = 'http://www.w3.org/2000/svg';
  for (const w of words) {
    w.step = STEP;
    const planeW = Math.max((w.len + 3.0) * STEP, 2.8 * FH);
    const planeH = planeW / PLANE_ASPECT;
    w.w = planeW; w.ph = planeH;
    const el = document.createElement('div'); el.className = 'word';
    el.style.fontSize = FS + 'px';
    el.style.setProperty('--cw', STEP + 'px'); el.style.setProperty('--len', String(w.len));
    el.style.setProperty('--u', FH + 'px'); el.style.setProperty('--fs', FS + 'px');
    el.style.setProperty('--w', planeW + 'px');
    const plane = document.createElement('div'); plane.className = 'plane';
    const svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('class', 'plane-svg'); svg.setAttribute('viewBox', '0 0 200 200'); svg.setAttribute('preserveAspectRatio', 'none');
    const p = document.createElementNS(svgNS, 'path'); p.setAttribute('d', PLANE_PATH);
    svg.appendChild(p); plane.appendChild(svg);
    const letters = document.createElement('div'); letters.className = 'wletters';
    w.charEls = [];
    for (let i = 0; i < w.len; i++) {
      const s = document.createElement('span'); const isSpace = w.text[i] === ' ';
      s.className = 'wchar' + (isSpace ? ' space' : '');
      s.textContent = isSpace ? '␣' : w.text[i];
      letters.appendChild(s); w.charEls.push(s);
    }
    plane.appendChild(letters); el.appendChild(plane);
    w.planeEl = plane; plane.style.setProperty('--planescale', '1'); w.scale = 1;
    updatePlaneSize(w);
    el.style.left = w.x + 'px'; el.style.top = (w.y - w.ph) + 'px';
    el.style.display = (w.state === 'falling') ? '' : 'none';
    w.el = el; game.appendChild(el);
  }
}

function updateRewardIconScale(w) {
  if (!w || !w.planeEl) return;
  const icon = w.planeEl.querySelector('.plane-reward-icon');
  if (!icon) return;
  const scale = Math.max(0.5, Math.min(1, w.scale || 1));
  // 飞机是围绕中心缩小的，因此机头会向飞机中心收缩；道具同步向中心移动。
  const bottomPct = 13 + (1 - scale) * 37;
  icon.style.setProperty('--reward-bottom', bottomPct.toFixed(2) + '%');
  icon.style.setProperty('--reward-size', (28 * scale).toFixed(1) + 'px');
  icon.style.setProperty('--reward-font', (17 * scale).toFixed(1) + 'px');
  icon.style.setProperty('--reward-border', Math.max(0.6, scale).toFixed(2) + 'px');
  icon.style.setProperty('--reward-glow', (8 * scale).toFixed(1) + 'px');
}

function updatePlaneSize(w) {
  const scale = 0.5 + 0.5 * (w.hp / w.len); w.scale = scale;
  if (w.planeEl) w.planeEl.style.setProperty('--planescale', scale.toFixed(3));
  w.step = STEP * scale;
  if (w.el) w.el.style.setProperty('--cw', w.step + 'px');
  updateRewardIconScale(w);
}

  const txt = $('#hpText');
  if (txt) { txt.textContent = Math.max(0, playerHP) + '/' + playerMaxHP; }
}

function renderEnergyBar() {
  const bar = $('#energyBar'); if (!bar) return;
  bar.innerHTML = '';
  for (let i = 0; i < MAX_ENERGY; i++) {
    const cell = document.createElement('div'); cell.className = 'energy-cell';
    if (i < energy) cell.classList.add(energy >= MAX_ENERGY ? 'full' : 'filled');
    bar.appendChild(cell);
  }
  const label = $('#energyLabel');
  if (label) label.style.display = 'none';
  
  if (itemModeEnabled) {
    const f1 = $('#item-f1');
    if (f1) {
      if (energy >= MAX_ENERGY) {
        f1.classList.remove('disabled');
        f1.classList.remove('used');
      } else {
        f1.classList.add('disabled');
      }
    }
  }
}

function addEnergy(fromX, fromY) {
  if (!itemModeEnabled || energy >= MAX_ENERGY) return; 
  if (fromX == null) { energy++; renderEnergyBar(); return; }
  const bar = $('#energyBar'); if (!bar) { energy++; renderEnergyBar(); return; }
  const rect = bar.getBoundingClientRect(), gameRect = game.getBoundingClientRect();
  const targetX = rect.left - gameRect.left + rect.width / 2 - 7, targetY = rect.top - gameRect.top + rect.height / 2 - 7;
  const orb = document.createElement('div'); orb.className = 'energy-orb';
  orb.style.left = (fromX - 7) + 'px'; orb.style.top = (fromY - 7) + 'px'; orb.style.transform = 'scale(1)';
  game.appendChild(orb);
  requestAnimationFrame(() => { orb.style.left = targetX + 'px'; orb.style.top = targetY + 'px'; orb.style.transform = 'scale(.5)'; });
  setTimeout(() => {
    if (orb.parentNode) orb.remove();
    if (energy < MAX_ENERGY) { energy++; renderEnergyBar(); if (energy >= MAX_ENERGY) energyFullSfx(); else energyCollectSfx(); }
  }, 1100);
}

function resetEnergy() { energy = 0; renderEnergyBar(); }

function fireMegaLaser() {
  if (!running || !itemModeEnabled || energy < MAX_ENERGY) return;
  normalizeIdx();
  let target = (wIdx >= 0) ? words[wIdx] : null;
  if (!target || target.state !== 'falling' || target.isFailed) return;
  const ccx = target.x + target.w / 2, ccy = getTextCenterY(target), ang = angleTo(ccx, ccy) * Math.PI / 180;
  barrel.style.transform = `rotate(${angleTo(ccx, ccy)}deg)`;
  const tipX = cx + BARREL_LEN * Math.sin(ang), tipY = cy - BARREL_LEN * Math.cos(ang), d = Math.hypot(ccx - tipX, ccy - tipY);
  const ml = document.createElement('div'); ml.className = 'mega-laser';
  ml.style.left = tipX + 'px'; ml.style.top = (tipY - 4) + 'px'; ml.style.width = d + 'px';
  ml.style.transform = `rotate(${Math.atan2(ccy - tipY, ccx - tipX) * 180 / Math.PI}deg)`;
  game.appendChild(ml); setTimeout(() => { if (ml.parentNode) ml.remove(); }, 500);
  megaLaserSfx();
  typedCount += (target.len - target.pos); target.hp = 0; 
  target._megaKilled = true; 
  killWord(target, true); resetEnergy();
  
  const el = $('#item-f1'); if (el) { el.classList.add('used'); setTimeout(() => el.classList.remove('used'), 350); }
  showItemMsg("导弹发射！");
}

function reposition() {
  for (const w of words) {
    if (!w.el) continue;
    w.el.style.fontSize = (w.fs || FS) + 'px';
    if (w.state === 'falling') {
      const wWidth = w.w;
      if (w.x < 20) w.x = 20; if (w.x > innerWidth - 20 - wWidth) w.x = Math.max(20, innerWidth - 20 - wWidth);
      w.el.style.left = w.x + 'px'; w.el.style.top = (w.y - w.ph) + 'px';
    }
  }
}

function angleTo(tx, ty) { return Math.atan2(tx - cx, cy - ty) * 180 / Math.PI; }

// 飞机的纵向逻辑统一以文字区域为核心。
// .wletters 的中心位于飞机容器高度约 51% 处，因此用文字中心坐标来决定出生、锁定、层级和越线。
const TEXT_CENTER_RATIO = 0.51;
function getTextCenterY(w) {
  if (!w) return -Infinity;
  return w.y - w.ph + w.ph * TEXT_CENTER_RATIO;
}
function setTextCenterY(w, textY) {
  if (!w) return;
  w.y = textY + w.ph * (1 - TEXT_CENTER_RATIO);
}
function isTextVisible(w) {
  if (!w || !w.el) return false;
  const letters = w.el.querySelector('.wletters');
  if (letters) {
    const r = letters.getBoundingClientRect();
    return r.bottom > 0 && r.top < innerHeight && r.right > 0 && r.left < innerWidth;
  }
  const ty = getTextCenterY(w);
  return ty > -FS && ty < innerHeight + FS;
}

// 改为使用 DOM 坐标实时测量以获取字符的精确视觉位置
function charVisualPos(w, i) {
  const ch = w.charEls[i];
  if (ch) {
    const chRect = ch.getBoundingClientRect(), gameRect = game.getBoundingClientRect();
    return { x: chRect.left - gameRect.left + chRect.width / 2, y: chRect.top - gameRect.top + chRect.height / 2 };
  }
  return { x: w.x + w.w / 2, y: getTextCenterY(w) };
}

function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = null) {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
}
function melody(notes, step = 0.12, type = 'square', vol = 0.06) {
  if (!soundOn) return; notes.forEach((f, i) => setTimeout(() => tone(f, step * 0.9, type, vol), i * step * 1000));
}
function hitSfx()  { tone(1400, 0.08, 'square', 0.05, 500); }
function wrongSfx() { tone(130, 0.18, 'sawtooth', 0.06); }
function missSfx() { tone(80, 0.25, 'sine', 0.09); }
function explodeSfx() {
  if (!soundOn) return; const a = ac(); if (!a) return;
  const dur = 0.32, buf = a.createBuffer(1, Math.floor(a.sampleRate * dur), a.sampleRate), data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = a.createBufferSource(); src.buffer = buf; const g = a.createGain();
  g.gain.setValueAtTime(0.2, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 950;
  src.connect(lp); lp.connect(g); g.connect(a.destination); src.start(); src.stop(a.currentTime + dur);
}
function winSfx()  { melody([523, 659, 784, 1047], 0.12, 'square', 0.05); }

const BARREL_LEN = 50;
function fire(tx, ty, isWrong) {
  const ang = angleTo(tx, ty) * Math.PI / 180; barrel.style.transform = `rotate(${angleTo(tx, ty)}deg)`;
  const tipX = cx + BARREL_LEN * Math.sin(ang), tipY = cy - BARREL_LEN * Math.cos(ang), d = Math.hypot(tx - tipX, ty - tipY);
  const l = document.createElement('div'); l.className = 'laser' + (isWrong ? ' wrong' : '');
  l.style.left = tipX + 'px'; l.style.top = (tipY - 1) + 'px'; l.style.width = d + 'px';
  l.style.transform = `rotate(${Math.atan2(ty - tipY, tx - tipX) * 180 / Math.PI}deg)`;

  if (isWrong) wrongSfx(); else hitSfx();

// 根据字符串长度计算道具掉落概率：最低档 10%，每提升一个长度档位增加 10%。
// 同时配合 itemRewardGap，避免道具飞机连续出现。
function getItemDropChance(len) {
  if (len <= 2) return 0.10;  // 1-2 字符：10%
  if (len <= 4) return 0.20;  // 3-4 字符：20%
  if (len <= 6) return 0.30;  // 5-6 字符：30%
  if (len <= 9) return 0.40;  // 7-9 字符：40%
  if (len <= 12) return 0.50; // 10-12 字符：50%
  if (len <= 15) return 0.60; // 13-15 字符：60%
  if (len <= 20) return 0.70; // 16-20 字符：70%
  return 0.80;                // 21-25 字符：80%
}

function activate() {
  let f = 0;
  for (const w of words) if (w.state === 'falling') f++;

  let longOnScreen = words.some(w => {
    if (!w.isLongText || !w.el || !w.el.parentNode || w.el.style.display === 'none') return false;
    if (w.state === 'wait' || w.state === 'gone' || w.state === 'dead') return false;
    // 长文本从排队进入屏幕前就占用长文本通道，直到它的文字真正离开屏幕底部，避免第二架长文本提前出现。
    return getTextCenterY(w) < innerHeight + FS;
  });

  while (f < MAXFALL && nextWait < words.length) {
    // 若屏幕上已有长字符串，优先从后续等待队列里找短字符串补位。
    // 找不到短字符串时暂停生成，直到当前长字符串离开屏幕。
    let spawnIndex = nextWait;
    if (longOnScreen && words[spawnIndex] && words[spawnIndex].isLongText) {
      spawnIndex = -1;
      for (let i = nextWait + 1; i < words.length; i++) {
        if (words[i].state === 'wait' && !words[i].isLongText) { spawnIndex = i; break; }
      }
      if (spawnIndex < 0) break;
    }

    // 将选中的待出场飞机换到队首，保持 nextWait 仍是单向游标。
    if (spawnIndex !== nextWait) {
      const tmp = words[nextWait];
      words[nextWait] = words[spawnIndex];
      words[spawnIndex] = tmp;
    }

    const w = words[nextWait++];
    if (!w || w.state !== 'wait') continue;
    if (w.isLongText && longOnScreen) { nextWait--; break; }

    w.state = 'falling'; w.el.style.display = '';
    const wWidth = w.w, MIN_GAP = 30, xMin = 20, xMax = Math.max(xMin + 10, innerWidth - 20 - wWidth);
    let bestX = xMin + Math.random() * (xMax - xMin), bestOverlap = Infinity;
    for (let attempt = 0; attempt < 15; attempt++) {
      const x = xMin + Math.random() * (xMax - xMin); let overlap = 0;
      for (const o of words) {
        if (o === w || o.state !== 'falling') continue;
        const oLeft = o.x, oRight = o.x + o.w, nLeft = x, nRight = x + wWidth;
        const ov = Math.min(oRight + MIN_GAP, nRight) - Math.max(oLeft - MIN_GAP, nLeft);
        if (ov > 0) overlap += ov;
      }
      if (overlap === 0) { bestX = x; bestOverlap = 0; break; }
      if (overlap < bestOverlap) { bestOverlap = overlap; bestX = x; }
    }
    w.x = bestX;
    // 关键：按文字中心安排纵向队列，而不是按飞机底部。
    // 第一个待输入文本最靠前，后续文本依次排在它上方；飞机大小不会改变输入先后。
    const spawnTextY = -24 - f * Math.max(90, SPEED * 1.5);
    setTextCenterY(w, spawnTextY);
    w.el.style.left = w.x + 'px'; w.el.style.top = (w.y - w.ph) + 'px';

    if (w.isLongText) longOnScreen = true;
    
    if (itemModeEnabled) {
      // 每生成一架飞机都累积间隔；只有至少隔过 2 架普通飞机后，才允许再次参与掉落判定。
      itemRewardGap++;
      const dropChance = getItemDropChance(w.len);
      const canRollReward = itemRewardGap >= 3 && Math.random() < dropChance;

      if (canRollReward) {
        let missing = [];
        if (!itemF2Owned) missing.push('F2');
        if (!itemF3Owned) missing.push('F3');
        if (!itemF4Owned) missing.push('F4');
        if (!itemF5Owned) missing.push('F5');
        if (!itemF6Owned) missing.push('F6');

        // 屏幕上已经携带的同类道具不重复出现。
        const carried = words.filter(x => x.state === 'falling' && x.itemReward).map(x => x.itemReward);
        const available = missing.filter(item => !carried.includes(item));

        if (available.length) {
          // 在当前可掉落道具中随机选择，避免总是按 F2→F6 固定顺序出现。
          const item = available[Math.floor(Math.random() * available.length)];
          w.itemReward = item;
          itemRewardGap = 0;

          const iconDiv = document.createElement('div');
          iconDiv.className = 'plane-reward-icon';
          iconDiv.textContent = item === 'F2' ? '⏳' : (item === 'F3' ? '💣' : (item === 'F4' ? '💨' : (item === 'F5' ? '🤖' : '♥')));
          if (item === 'F6') {
            iconDiv.style.color = '#ff4d67';
            iconDiv.style.textShadow = '0 0 8px rgba(255,77,103,.85)';
            iconDiv.style.borderColor = '#ff4d67';
          }
          w.planeEl.appendChild(iconDiv);
          updateRewardIconScale(w);
        }
      }
    }
    f++;
  }
}

// 统一目标判定：锁定当前画面可见、尚有字符需要输入、且离防线最近的飞机。
// 即使该飞机已经输错并标红，也继续锁定它直到剩余字符输入完毕；标红只影响最终击落/奖励，不影响继续输入。
function getAttackTarget() {
  let best = null, bestTextY = -Infinity;
  for (const w of words) {
    if (w.state !== 'falling' || w.pos >= w.len || !w.el) continue;
    // 只有文字区域真正进入画面后才允许锁定，避免大飞机机身先露出但文字仍在屏幕外。
    if (!isTextVisible(w)) continue;
    const ty = getTextCenterY(w);
    if (!best || ty > bestTextY) { best = w; bestTextY = ty; }
  }
  return best;
}

function normalizeIdx() {
  const target = getAttackTarget();
  wIdx = target ? words.indexOf(target) : -1;
}

function correct(w) {
  const p = charVisualPos(w, w.pos); fire(p.x, p.y);
  const s = w.charEls[w.pos]; if (s) s.className = 'wchar done';
  w.hp--; typedCount++; updatePlaneSize(w);
  score += 10 + combo * 2; combo++; if (combo > maxCombo) maxCombo = combo; hits++;
  if (combo >= 2) showCombo(combo);
  w.pos++; 
  // 只有未被标红的飞机完整敲完才会爆炸；如果已经标红，则不触发爆炸，让它空壳飘走
  if (w.pos >= w.len) {
    if (!w.isFailed) {
      finishWord(w);
    }
  }
}

  } else { ccx = w.x + w.w / 2; ccy = getTextCenterY(w); }
  
  // 纯手动击落且未出错的飞机才能触发奖励
  let isManualKill = byPlayer && !w._megaKilled && !w._autoKilled && !w.isFailed;

      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      game.appendChild(el); setTimeout(() => { if (el.parentNode) el.remove(); }, 1700);
    }
    const el = w.el; setTimeout(() => { if (el.parentNode) el.remove(); }, 200);

// 只把“仍有字符需要处理”的飞机视为战斗目标。
// 已经输完但因输错而无法击落的红色飞机只是残留空壳，不再阻塞最终结算。
function hasPendingInput(w) {
  if (!w) return false;
  if (w.state === 'wait') return true;
  return w.state === 'falling' && w.pos < w.len;
}

function hasOtherPlanes(currentW) {
  for (const w of words) {
    if (w === currentW) continue;
    if (hasPendingInput(w)) return true;
  }
  return false;
}

function hasAnyPendingInput() {
  return words.some(hasPendingInput);
}

function finishWord(w) {
  if (w.hp <= 0) {
    w.state = 'dead'; kills++;
    if (w._retreating && w.el) {
      const elRect = w.el.getBoundingClientRect(), gameRect = game.getBoundingClientRect();
      w.y = elRect.bottom - gameRect.top; w._retreating = false;
      w.el.classList.remove('retreating'); w.el.style.transitionDuration = ''; w.el.style.top = (w.y - w.ph) + 'px';
    }
    if (targetCharEl && w.charEls.includes(targetCharEl)) { targetCharEl.classList.remove('target'); targetCharEl = null; }
    if (!hasOtherPlanes(w)) {
      reticle.style.display = 'none'; retreatMsg.style.display = 'none';
      if (w.el) w.el.classList.add('final-shaking');
      setTimeout(() => { killWord(w, true); }, 1100);
    } else {
      reticle.style.display = 'none'; retreatMsg.style.display = 'none';
      if (w.el) w.el.classList.add('pre-explode');
      setTimeout(() => { killWord(w, true); }, 500);
    }
  } else { w.state = 'passed'; if (w.el) w.el.classList.add('missed'); }
}

}

function feedChar(ch) {
  if (!/^[\x20-\x7E]$/.test(ch)) return;
  normalizeIdx(); const w = (wIdx >= 0) ? words[wIdx] : null;
  if (!w || w.state !== 'falling') return;
  if (ch === w.text[w.pos]) correct(w); else wrong(w);
}

const typer = $('#typer');
let composing = false;

// 游戏过程中不再依赖文本输入框，而是直接读取 KeyboardEvent.code（物理键位）。
// 这样系统即使处于中文输入法，也不会产生候选框/拼音组合，更不会在 Enter 时批量提交字符。
const SHIFT_DIGITS = { Digit1:'!', Digit2:'@', Digit3:'#', Digit4:'$', Digit5:'%', Digit6:'^', Digit7:'&', Digit8:'*', Digit9:'(', Digit0:')' };
const PUNCT_KEYS = {
  Backquote:['`','~'], Minus:['-','_'], Equal:['=','+'],
  BracketLeft:['[','{'], BracketRight:[']','}'], Backslash:['\\','|'],
  Semicolon:[';',':'], Quote:["'",'"'], Comma:[',','<'], Period:['.','>'], Slash:['/','?'],
  IntlBackslash:['\\','|']
};

function physicalKeyToAscii(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return null;
  const c = e.code || '';
  if (/^Key[A-Z]$/.test(c)) {
    const ch = c.slice(3);
    return e.shiftKey ? ch : ch.toLowerCase();
  }
  if (/^Digit[0-9]$/.test(c)) return e.shiftKey ? SHIFT_DIGITS[c] : c.slice(5);
  if (c === 'Space') return ' ';
  if (PUNCT_KEYS[c]) return PUNCT_KEYS[c][e.shiftKey ? 1 : 0];
  if (/^Numpad[0-9]$/.test(c)) return c.slice(6);
  if (c === 'NumpadDecimal') return '.';
  if (c === 'NumpadAdd') return '+';
  if (c === 'NumpadSubtract') return '-';
  if (c === 'NumpadMultiply') return '*';
  if (c === 'NumpadDivide') return '/';
  return null;
}

// 即使浏览器/系统意外尝试向隐藏输入框写入 IME 内容，也全部丢弃。
typer.addEventListener('beforeinput', (e) => { e.preventDefault(); typer.value = ''; });
typer.addEventListener('compositionstart', (e) => { composing = true; typer.value = ''; if (e.cancelable) e.preventDefault(); });
typer.addEventListener('compositionupdate', (e) => { typer.value = ''; if (e.cancelable) e.preventDefault(); });
typer.addEventListener('compositionend', (e) => { composing = false; typer.value = ''; if (e.cancelable) e.preventDefault(); });
typer.addEventListener('input', () => { typer.value = ''; });
typer.addEventListener('paste', (e) => { e.preventDefault(); typer.value = ''; });
typer.addEventListener('copy', (e) => { e.preventDefault(); });
typer.addEventListener('cut', (e) => { e.preventDefault(); typer.value = ''; });
document.addEventListener('copy', (e) => { e.preventDefault(); });
document.addEventListener('paste', (e) => { e.preventDefault(); });
document.addEventListener('cut', (e) => { e.preventDefault(); });

let enterHeld = false;
document.addEventListener('keydown', (e) => {
  // ESC 始终优先，哪怕操作系统刚好处于输入法组合状态也能退出游戏。
  if (e.key === 'Escape' || e.code === 'Escape') {
    if (running) {
      e.preventDefault();
      composing = false;
      typer.value = '';
      $('#exitBtn').click();
    }
    return;
  }

  // 非游戏界面保留 Enter 开始/重开。
  if (!running) {
    if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
      e.preventDefault();
      if (!startScreen.classList.contains('hidden')) $('#startBtn').click();
      else if (!endScreen.classList.contains('hidden')) $('#againBtn').click();
    }
    return;
  }

  // Windows/浏览器在中文 IME 组合阶段常返回 isComposing=true 或 keyCode=229。
  // 游戏中直接吞掉这些事件，不允许候选文字、拼音串或回车提交进入游戏逻辑。
  if (e.isComposing || composing || e.keyCode === 229 || e.key === 'Process') {
    e.preventDefault();
    typer.value = '';
    return;
  }

  // 游戏内 Enter/F1 仍作为满能量导弹快捷键，但只响应非 IME 状态的真实按键。
  if (e.key === 'Enter' || e.code === 'Enter' || e.code === 'NumpadEnter') {
    e.preventDefault();
    if (itemModeEnabled && energy >= MAX_ENERGY && !enterHeld) {
      enterHeld = true;
      fireMegaLaser();
    }
    return;
  }

  if (e.code === 'F1' && itemModeEnabled && energy >= MAX_ENERGY && !enterHeld) {
    e.preventDefault(); enterHeld = true; fireMegaLaser(); return;
  }

  if (itemModeEnabled) {
    if (e.code === 'F2') { e.preventDefault(); useItemF2(); return; }
    if (e.code === 'F3') { e.preventDefault(); useItemF3(); return; }
    if (e.code === 'F4') { e.preventDefault(); useItemF4(); return; }
    if (e.code === 'F5') { e.preventDefault(); useItemF5(); return; }
    if (e.code === 'F6') { e.preventDefault(); useItemF6(); return; }
  }

  // 真正的打字输入只看物理键位，不看 IME 转换后的 e.key 文本。
  const ch = physicalKeyToAscii(e);
  if (ch !== null) {
    e.preventDefault();
    feedChar(ch);
  }
});

document.addEventListener('keyup', (e) => {
  if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'F1') enterHeld = false;
});

// ==== 道具功能 ====
function showItemMsg(msg) {
  const el = $('#itemMsg');
  const slowEl = $('#slowTimer');

  // 绿色提示统一为单实例：新提示出现时，先清除上一条可见提示。
  if (slowEl) slowEl.style.display = 'none';
  if (itemMsgTimer) { clearTimeout(itemMsgTimer); itemMsgTimer = null; }

  el.textContent = msg;
  el.style.display = 'block';
  itemMsgTimer = setTimeout(() => {
    el.style.display = 'none';
    itemMsgTimer = null;
  }, 2000);
}

function clearSlowMode(restoreSpeed = true) {
  if (slowTimerInterval) { clearInterval(slowTimerInterval); slowTimerInterval = null; }
  if (slowTimerTimeout) { clearTimeout(slowTimerTimeout); slowTimerTimeout = null; }
  slowModeActive = false;
  if (restoreSpeed) SPEED = BASE_SPEED;
  const timerEl = $('#slowTimer');
  if (timerEl) timerEl.style.display = 'none';
}

function startSlowCountdown(seconds = 5) {
  clearSlowMode(false);
  slowModeActive = true;
  SPEED = BASE_SPEED * 0.5;

  const timerEl = $('#slowTimer');
  const itemEl = $('#itemMsg');
  let remaining = seconds;
  const renderCountdown = () => {
    if (!timerEl) return;

    // 倒计时本身也是绿色提示；出现时立即清除上一条提示，避免同位置叠加。
    if (itemMsgTimer) { clearTimeout(itemMsgTimer); itemMsgTimer = null; }
    if (itemEl) itemEl.style.display = 'none';

    timerEl.textContent = `时间缓慢 ${remaining} 秒`;
    timerEl.style.display = 'block';
  };
  renderCountdown();

  const sid = gameSessionId;
  slowTimerInterval = setInterval(() => {
    if (sid !== gameSessionId || !running) { clearSlowMode(true); return; }
    remaining -= 1;
    if (remaining > 0) renderCountdown();
  }, 1000);

  slowTimerTimeout = setTimeout(() => {
    if (sid !== gameSessionId) return;
    clearSlowMode(true);
  }, seconds * 1000);
}

function useItemF2() {
  if (!itemF2Owned) return;
  itemF2Owned = false;
  let el = $('#item-f2');
  el.classList.add('used');
  setTimeout(() => { if(el) el.className = 'item-box disabled'; }, 350);
  startSlowCountdown(5);
  megaLaserSfx();
}

function useItemF3() {
  if (!itemF3Owned) return;

  // 先快照目标，避免边遍历边执行完整 killWord() 造成大量同步 DOM 创建与强制重绘。
  const targets = words.filter(w => w.state === 'falling' && !w.isFailed);
  if (!targets.length) return;

  itemF3Owned = false;
  const el = $('#item-f3');
  el.classList.add('used');
  setTimeout(() => { if (el) el.className = 'item-box disabled'; }, 350);

  // 最多给 6 架飞机显示局部轻量爆炸，其余直接淡出；保证飞机很多时帧率仍稳定。
  targets.forEach((w, i) => {
    typedCount += Math.max(0, w.len - w.pos);
    bombKillWord(w, i < 6);
  });

  // 清屏只做一次全局爆炸和音效，不触发屏幕抖动。
  bigExplode(cx, Math.max(140, innerHeight * 0.45));
  megaLaserSfx();
  showItemMsg("F3: 炸弹清屏");
  normalizeIdx();
  updateHUD();
}

function useItemF4() {
  if (!itemF4Owned) return;
  
  let el = $('#item-f4');
  el.classList.add('used');
  setTimeout(() => { if(el) el.className = 'item-box disabled'; }, 350);

  const retreatDist = innerHeight * 0.4;
  const retreatSpeed = retreatDist / 0.6; 
  let maxDur = 0;
  let anyRetreated = false;

  for (const w of words) {
    if (w.state === 'falling') {
      const oldY = w.y; w.y -= retreatDist;
      const actualDist = oldY - w.y, dur = actualDist / retreatSpeed;
      if (dur > maxDur) maxDur = dur;
      w._retreating = true;
      if (w.el) {
        w.el.classList.add('retreating'); w.el.style.transitionDuration = dur + 's';
        w.el.style.top = (w.y - w.ph) + 'px';
        setTimeout(() => {
          w._retreating = false;
          if (w.el) { w.el.classList.remove('retreating'); w.el.style.transitionDuration = ''; }
        }, Math.max(dur * 1000, 50));
      }
      anyRetreated = true;
    }
  }

  if (anyRetreated && maxDur > 0) {
    itemF4Owned = false;
    bgRetreat = true; retreatMsg.textContent = '全体后退'; retreatMsg.style.display = 'block'; retreatSfx();
    setTimeout(() => { if (retreatMsg.textContent === '全体后退') retreatMsg.style.display = 'none'; bgRetreat = false; }, maxDur * 1000);
    showItemMsg("F4: 全体后退");
  } else {
    setTimeout(() => { if(el) el.className = 'item-box'; }, 350);
  }
}

function useItemF5() {
  if (!itemF5Owned) return;
  itemF5Owned = false;
  let el = $('#item-f5');
  el.classList.add('used');
  setTimeout(() => { if(el) el.className = 'item-box disabled'; }, 350);
  showItemMsg("F5: 连击模式开启");
  
  let count = 20;
  let interval = setInterval(() => {
    if (!running || count <= 0) { clearInterval(interval); return; }
    normalizeIdx(); 
    let w = (wIdx >= 0) ? words[wIdx] : null;
    if (!w || w.state !== 'falling') { clearInterval(interval); return; }
    w._autoKilled = true; 
    correct(w); 
    count--;
  }, 50); 
}

function useItemF6() {
  if (!itemF6Owned) return;
  if (playerHP >= playerMaxHP) {
    showItemMsg("F6: 生命值已满");
    return;
  }

  const before = playerHP;
  playerHP = Math.min(playerMaxHP, playerHP + 5);
  const healed = playerHP - before;
  itemF6Owned = false;

  const el = $('#item-f6');
  if (el) {
    el.classList.add('used');
    setTimeout(() => { if (el) el.className = 'item-box disabled heal-item'; }, 350);
  }

  updatePlayerHP();
  showItemMsg(`F6: 回复 ${healed} 点生命`);
}

function loop(t) {
  if (!running) return;
  const dt = Math.min(0.05, (t - lastT) / 1000) || 0; lastT = t;
  const dy = SPEED * dt;
  activate(); normalizeIdx();
  for (const w of words) {
    if (w.state === 'falling' || w.state === 'passed' || w.state === 'crossed') {
      if (w._retreating) continue;
      w.y += dy; w.el.style.top = (w.y - w.ph) + 'px';
      if (w.state === 'falling' && getTextCenterY(w) > MISSY) {
        reachLine(w);
      } else if ((w.state === 'passed' || w.state === 'crossed') && (w.y - w.ph) > innerHeight) {
        w.state = 'gone'; if (w.el) w.el.remove();
      }
    }
  }
  normalizeIdx();
  const flist = [];
  for (const wd of words) if (wd.state === 'falling') flist.push(wd);
  flist.sort((a, b) => getTextCenterY(a) - getTextCenterY(b));
  flist.forEach((wd, idx) => { if (wd.el) wd.el.style.zIndex = 2 + idx; });
  const w = (wIdx >= 0) ? words[wIdx] : null;
  if (w && w.state === 'falling') {
    const p = charVisualPos(w, w.pos);
    barrel.style.transform = `rotate(${angleTo(p.x, p.y)}deg)`;
    reticle.style.left = p.x + 'px'; reticle.style.top = p.y + 'px'; reticle.style.display = 'block';
    const ch = w.charEls[w.pos];
    if (targetCharEl !== ch) { if (targetCharEl) targetCharEl.classList.remove('target'); ch.classList.add('target'); targetCharEl = ch; }
  } else {
    reticle.style.display = 'none'; retreatMsg.style.display = 'none';
    if (targetCharEl) { targetCharEl.classList.remove('target'); targetCharEl = null; }
  }
  updateHUD();
  // 战斗结束以“是否还有待输入字符”为准，而不是等待所有残留飞机撞线。
  // 因此：最后一个可击落目标被消灭后，已经输完的失败飞机即使仍在屏幕中，也不会拖延结算。
  if (words.length && !hasAnyPendingInput()) {
    running = false;
    if (targetCharEl) { targetCharEl.classList.remove('target'); targetCharEl = null; }
    reticle.style.display = 'none'; retreatMsg.style.display = 'none';
    if (defenseLine) defenseLine.style.display = 'none';
    hideCombo();

    const sid = gameSessionId;
    const hasFinalKillAnim = words.some(w => w.el && w.el.classList.contains('final-shaking'));
    const endDelay = hasFinalKillAnim ? 1450 : 450;
    setTimeout(() => {
      if (sid !== gameSessionId) return;
      // 结算前移除仍在屏幕上的失败/漏打残留飞机，避免它们留在结算界面背景中。
      for (const wd of words) {
        if (wd.state !== 'dead' && wd.el && wd.el.parentNode) wd.el.remove();
      }
      end(true);
    }, endDelay);
    return;
  }
  raf = requestAnimationFrame(loop);
}

function fmtTime(s) { const m = Math.floor(s / 60), ss = Math.floor(s % 60); return (m < 10 ? '0' : '') + m + ':' + (ss < 10 ? '0' : '') + ss; }

function end(win) {
  running = false;
  clearSlowMode(true);
  if (targetCharEl) { targetCharEl.classList.remove('target'); targetCharEl = null; }
  reticle.style.display = 'none'; retreatMsg.style.display = 'none';
  if (defenseLine) defenseLine.style.display = 'none';
  showGameUI(false); hideCombo();
  const cannon = $('#cannon'); if (cannon) cannon.classList.remove('exploding');
  $('#endTitle').textContent = '战斗结束';
  $('#endStats').innerHTML =
    `<div class="stat-item"><span class="stat-icon">🎯</span><div class="stat-body"><span class="stat-label">击落</span><span class="stat-value green">${kills}</span></div></div>` +
    `<div class="stat-item"><span class="stat-icon">⚔️</span><div class="stat-body"><span class="stat-label">命中</span><span class="stat-value">${hits}</span></div></div>` +
    `<div class="stat-item"><span class="stat-icon">🔥</span><div class="stat-body"><span class="stat-label">最高连击</span><span class="stat-value gold">${maxCombo}</span></div></div>` +
    `<div class="stat-item"><span class="stat-icon">💔</span><div class="stat-body"><span class="stat-label">受击</span><span class="stat-value red">${miss}</span></div></div>`;
  $('#endTime').textContent = '';
  if (win) winSfx(); else loseSfx();
  endScreen.classList.remove('hidden');
}

function startGame() {
  if (selectedLevel < 0) { $('#hint').textContent = '请先选择一个关卡'; return; }
  const lv = LEVELS[selectedLevel];
  clearSlowMode(false);
  if (lv.name === '自定义') {
    SPEED = getCustomSpeed();
    const csInput = $('#customSpeed');
    if (csInput) csInput.value = String(SPEED);
  } else { SPEED = lv.speed; }
  BASE_SPEED = SPEED;
  $('#hint').textContent = '';
  
  itemModeEnabled = document.querySelector('input[name="gameMode"]:checked').value === 'item';
  
  itemF2Owned = false;
  itemF3Owned = false;
  itemF4Owned = false;
  itemF5Owned = false;
  
  if (itemModeEnabled) {
    $('#itemPanel').style.display = 'flex';
    $('#item-f1').className = 'item-box disabled';
    $('#item-f2').className = 'item-box disabled';
    $('#item-f3').className = 'item-box disabled';
    $('#item-f4').className = 'item-box disabled';
    $('#item-f5').className = 'item-box disabled';
    $('#item-f6').className = 'item-box disabled heal-item';
  } else {
    $('#itemPanel').style.display = 'none';
  }

  startScreen.classList.add('hidden'); endScreen.classList.add('hidden');
  gameSessionId++;
  showGameUI(true); initBoard();
  if (defenseLine) defenseLine.style.display = 'block';
  reticle.style.display = 'none'; retreatMsg.style.display = 'none';
  if (targetCharEl) { targetCharEl.classList.remove('target'); targetCharEl = null; }
  hideCombo();
  running = true; startT = lastT = performance.now();
  try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); game.tabIndex = -1; game.focus({preventScroll:true}); } catch (e) {}
  composing = false; typer.value = '';
  raf = requestAnimationFrame(loop);
}

$('#startBtn').onclick = startGame;
$('#againBtn').onclick = startGame;
$('#importBtn').onclick = () => { if (selectedLevel < 0) { $('#hint').textContent = '请先选择一个关卡'; return; } fileInput.click(); };
function resetToHome() {
  running = false;
  clearSlowMode(true);
  gameSessionId++; // 让上一局尚未执行的延迟攻击/伤害回调全部失效
  cancelAnimationFrame(raf);
  bgRetreat = false;
  if (itemMsgTimer) { clearTimeout(itemMsgTimer); itemMsgTimer = null; }
  hideCombo();
  if (targetCharEl) { targetCharEl.classList.remove('target'); targetCharEl = null; }
  reticle.style.display = 'none';
  retreatMsg.style.display = 'none';
  $('#itemMsg').style.display = 'none';
  if (defenseLine) defenseLine.style.display = 'none';

  // 清理上一局全部动态对象，主页绝不保留游玩中的飞机/子弹/爆炸/字符碎片。
  game.querySelectorAll('.word, .laser, .mega-laser, .flash, .particle, .explosion-flash, .shockwave, .eparticle, .edebris, .shard-char, .energy-orb, .char.tocannon').forEach(el => el.remove());
  words = []; wIdx = -1; nextWait = 0; totalChars = 0; typedCount = 0;
  score = combo = maxCombo = hits = miss = kills = 0;
  playerHP = playerMaxHP; energy = 0;
  itemF2Owned = itemF3Owned = itemF4Owned = itemF5Owned = itemF6Owned = false;
  itemRewardGap = 99;
  game.classList.remove('shakeBig');
  const cannon = $('#cannon'); if (cannon) cannon.classList.remove('exploding');
  updatePlayerHP(); renderEnergyBar(); updateHUD();

  showGameUI(false);
  endScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  // 注意：这里故意不修改 CODE / usingImportedCode，导入程序跨“重开”和“返回主页”持续保留。
  $('#hint').textContent = '';
}

$('#menuBtn').onclick = resetToHome;
$('#exitBtn').onclick = resetToHome;
$('#muteBtn').onclick = () => {
  soundOn = !soundOn;
  const btn = $('#muteBtn');
  if (btn) {
    btn.textContent = soundOn ? '🔊' : '🔇';
    btn.classList.toggle('sound-off', !soundOn);
    btn.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
    btn.setAttribute('aria-label', soundOn ? '关闭声音' : '开启声音');
    btn.title = soundOn ? '关闭声音' : '开启声音';
  }
};
fileInput.onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { CODE = r.result; usingImportedCode = true; startGame(); }; r.readAsText(f);
  e.target.value = '';
};
game.addEventListener('click', () => { if (running) { try { game.focus({preventScroll:true}); } catch(e) {} } });
window.addEventListener('resize', () => { initBg(); if (running) { layout(); reposition(); } });
initBg(); renderLevels(); bgRaf = requestAnimationFrame(bgLoop);
</script>

.typing-ctrl #tc-back,
.typing-ctrl #tc-fs,
.typing-ctrl #tc-exitfs {
    color: #aeb7c4;
}
.typing-ctrl #tc-back:hover,
.typing-ctrl #tc-fs:hover {
    color: #6ee0af;
}
.typing-ctrl #tc-exitfs {
    color: #d8ad45;
    border-color: rgba(216, 173, 69, .40);
}
.typing-ctrl #tc-exitfs:hover {
    color: #ffd24a;
    border-color: rgba(255, 210, 74, .72);
}
.typing-ctrl #muteBtn {
    font-size: 16px;
}
@media (max-width: 760px) {
    .typing-ctrl {
        right: 8px;
        top: 8px;
        gap: 3px;
        padding: 3px;
    }
    .typing-ctrl .tc-icon-btn {
        width: 32px;
        min-width: 32px;
        height: 32px;
        font-size: 16px;
    }
}
</style>
<script>
(function () {
    var back = document.getElementById('tc-back');
    var fs = document.getElementById('tc-fs');
    var exitfs = document.getElementById('tc-exitfs');
    if (back) back.addEventListener('click', function () {
        try { window.parent.postMessage('kuaioj:typing:exit', '*'); } catch (e) {}
    });
    function enterFs() {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    }
    function exitFs() {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
    if (fs) fs.addEventListener('click', enterFs);
    if (exitfs) exitfs.addEventListener('click', exitFs);
    function sync() {
        var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        document.body.classList.toggle('tc-fullscreen', isFs);
        if (fs) fs.style.display = isFs ? 'none' : '';
        if (exitfs) exitfs.style.display = isFs ? '' : 'none';
    }
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
})();
</script>
</body>
</html>
